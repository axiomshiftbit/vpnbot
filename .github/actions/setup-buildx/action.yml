# Сетевой сбой между runner и внешним сервисом не должен обрывать прогон:
# действие повторяется после пауз 15, 45, 90 с. Последняя попытка идёт
# без continue-on-error и решает исход шага.
name: Подготовка buildx с повторами
description: Повторяет действие при сетевом сбое
inputs:
  driver-opts:
    required: false
    default: ''
  buildkitd-config-inline:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      id: attempt1
      continue-on-error: true
      with:
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
    - if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: sleep 15
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      id: attempt2
      continue-on-error: true
      if: steps.attempt1.outcome == 'failure'
      with:
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
    - if: steps.attempt2.outcome == 'failure'
      shell: bash
      run: sleep 45
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      id: attempt3
      continue-on-error: true
      if: steps.attempt2.outcome == 'failure'
      with:
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
    - if: steps.attempt3.outcome == 'failure'
      shell: bash
      run: sleep 90
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      if: steps.attempt3.outcome == 'failure'
      with:
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
