# Build once -> checks -> disposable GitHub VPN stand -> atomic image-set pointer.
# No PR code is executed by this publication workflow. Candidate tags never
# replace working channels; publishing never rebuilds a tested image.
name: images
on:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      test_runner:
        description: 'Выполнить сборку и полный тестовый стенд на домашней Ubuntu VM'
        type: boolean
        default: false
      full_build:
        description: 'master: собрать и проверить заново, даже если комплект этого коммита уже допущен в dev'
        type: boolean
        default: false
      promote_master:
        description: 'dev: после успешной публикации передвинуть master на этот же коммит и перенести комплект'
        type: boolean
        default: false
  # Раз в две недели на серверах GitHub: пересборка со свежими пакетами и
  # проверка уязвимостей. На домашней VM тот же прогон запускает её собственный
  # таймер (scripts/ci_home_schedule.py): он навёрстывает пропуск после включения.
  schedule:
    - cron: '0 4 1,15 * *'
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # master, перемотанный ровно на коммит, комплект которого уже прошёл сборку,
  # проверки CVE и стенд в dev, получает ТЕ ЖЕ образы без пересборки. Во всех
  # остальных случаях задание отвечает promoted=false и идёт полный прогон.
  promote:
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      promoted: ${{ steps.decision.outputs.promoted }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
        if: github.ref == 'refs/heads/master' && github.event_name != 'schedule'
      - uses: ./.github/actions/registry-login
        if: github.ref == 'refs/heads/master' && github.event_name != 'schedule'
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decision
        env:
          FULL_BUILD: ${{ inputs.full_build }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_promote_bundle.py
  tests:
    needs: promote
    if: needs.promote.outputs.promoted != 'true'
    uses: ./.github/workflows/tests.yml
    with:
      test_runner: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner }}
  build:
    needs: tests
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: ng, image: ng}
          - {service: php, image: php}
          - {service: wg, image: wg}
          - {service: ad, image: ad}
          - {service: telemt, image: telemt}
          - {service: xr, image: xr}
          - {service: oc, image: oc}
          - {service: np, image: np}
          - {service: ss, image: ss}
          - {service: dnstt, image: dnstt}
          - {service: ovpn, image: ovpn}
          - {service: ipsec, image: ipsec}
          - {service: tt, image: tt}
          - {service: hy, image: hysteria}
          - {service: anytls, image: protocol}
          - {service: mieru, image: mieru}
          - {service: snolc, image: snolc}
          - {service: masque, image: masque}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: touch override.env
      - name: Проверить домашний тестовый хост перед сборкой
        if: inputs.test_runner
        run: |
          test "$(cat /etc/vpnbot-ci-test-host)" = home-build
          # Публикация вызывает gh; на GitHub-hosted он предустановлен, здесь — нет.
          command -v gh
          # Задания сборки идут параллельно на нескольких runner одной VM:
          # чужие сборщики buildx допустимы, любые другие контейнеры — нет.
          # Соседнее задание после своей сборки на секунды запускает проверочный
          # контейнер образа: ждём, пока он завершится. Настоящий посторонний
          # контейнер никуда не денется, и проверка откажет.
          for attempt in $(seq 1 24); do
            foreign=$(docker ps --format '{{.Names}}' | grep -v '^buildx_buildkit_' || true)
            [ -z "$foreign" ] && break
            sleep 5
          done
          test -z "$foreign"
          python3 -c 'import shutil; assert shutil.disk_usage("/var/lib/docker").free >= 12 * 1024**3, "Недостаточно места для безопасной сборки"'
      - uses: ./.github/actions/setup-buildx
        with:
          driver-opts: |
            ${{ inputs.test_runner && 'memory=3g' || '' }}
            ${{ inputs.test_runner && 'memory-swap=4g' || '' }}
            ${{ inputs.test_runner && 'cpu-period=100000' || '' }}
            ${{ inputs.test_runner && 'cpu-quota=200000' || '' }}
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = ${{ inputs.test_runner && 4 || 1 }}
              maxUsedSpace = "4GB"
              minFreeSpace = "3GB"
      # Сетевые шаги повторяются здесь же: перезапуск задания стоит полной
      # пересборки образа.
      - uses: ./.github/actions/registry-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        id: image
        continue-on-error: true
        with:
          files: docker-compose.yml
          targets: ${{ matrix.service }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          provenance: false
          sbom: false
          set: |
            *.platform=linux/amd64
            *.tags=ghcr.io/axiomshiftbit/vpnbot-${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
            *.cache-from=type=gha,scope=${{ matrix.service }}
            *.cache-to=${{ inputs.test_runner && 'type=inline' || format('type=gha,mode=max,scope={0}', matrix.service) }}
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
      # Сбой получения базового образа с Docker Hub длится дольше полуминуты:
      # 2026-10-09 обе попытки с паузой 30 с упёрлись в один и тот же таймаут.
      - if: steps.image.outcome == 'failure'
        run: sleep 120
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        id: image_retry
        if: steps.image.outcome == 'failure'
        with:
          files: docker-compose.yml
          targets: ${{ matrix.service }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          provenance: false
          sbom: false
          set: |
            *.platform=linux/amd64
            *.tags=ghcr.io/axiomshiftbit/vpnbot-${{ matrix.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
            *.cache-from=type=gha,scope=${{ matrix.service }}
            *.cache-to=${{ inputs.test_runner && 'type=inline' || format('type=gha,mode=max,scope={0}', matrix.service) }}
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
      - name: Проверить версии sing-box, Mihomo и Mieru
        if: contains(fromJSON('["php","anytls","mieru"]'), matrix.service)
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sh scripts/ci_retry.sh docker pull "$image"
          verify() {
            key=$1; binary=$2; flag=$3
            expected=$(sed -n "s/^${key}=//p" .env)
            actual=$(docker run --rm --network=none --entrypoint "$binary" "$image" "$flag")
            actual=${actual%%$'\n'*}
            case "$key" in
              SINGBOX_VERSION) [[ "$actual" == "sing-box version ${expected#v}" ]] ;;
              MIHOMO_VERSION) [[ "$actual" == "Mihomo Meta $expected "* ]] ;;
              MIERU_VERSION) [[ "$actual" == "${expected#v}" ]] ;;
            esac
            echo "$key: $actual"
            docker run --rm --network=none --entrypoint sha256sum "$image" "$binary"
          }
          case "$SERVICE" in
            php)
              verify SINGBOX_VERSION /usr/bin/sing-box version
              verify MIHOMO_VERSION /usr/bin/mihomo -v
              docker run --rm --network=none --entrypoint sh \
                -v "$PWD/tests/php_runtime_test.sh:/runtime-test.sh:ro" \
                -v "$PWD/config/php.ini:/etc/php85/php.ini:ro" \
                "$image" /runtime-test.sh
              docker run --rm --network=none --entrypoint sh "$image" -ec '
                printf "%s\n" '\''{"version":3,"rules":[{"domain":["example.test"]}]}'\'' > /tmp/rules.json
                sing-box rule-set compile --output /tmp/rules.srs /tmp/rules.json
                test -s /tmp/rules.srs
              '
              ;;
            anytls)
              verify SINGBOX_VERSION /usr/local/bin/sing-box version
              docker run --rm --network=none --entrypoint sha256sum "$image" /usr/local/bin/protocol-stats
              ;;
            mieru)
              verify MIERU_VERSION /usr/local/bin/mita version
              docker run --rm --network=none --entrypoint sha256sum "$image" /usr/local/bin/mieru-control
              ;;
          esac

      - name: Проверить встроенные версии Xray
        if: matrix.service == 'xr'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-xr:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sh scripts/ci_retry.sh docker pull "$image"
          while read -r key binary; do
            expected=$(sed -n "s/^${key}=//p" .env)
            if [[ "$key" == XRAY_VERSION_[23] && -z "$expected" ]]; then
              docker run --rm --network=none --entrypoint sh "$image" -c 'test ! -e "$1"' check "$binary"
              continue
            fi
            actual=$(docker run --rm --network=none --entrypoint "$binary" "$image" version)
            actual=${actual%%$'\n'*}
            echo "$key: $actual"
            docker run --rm --network=none --entrypoint sha256sum "$image" "$binary"
            if [[ "$expected" == v* ]]; then
              read -r name version rest <<< "$actual"
              test "$name" = Xray
              test "$version" = "${expected#v}"
            fi
          done <<'XRAY_CORES'
          XRAY_VERSION /usr/bin/xray
          XRAY_VERSION_2 /usr/bin/xray-2
          XRAY_VERSION_3 /usr/bin/xray-3
          XRAY_FORK_VERSION /usr/bin/xray-smux
          XRAY_CORES
          # У форка тег сборки и REALITY из собственного дерева видны только в
          # самом бинарнике: без них сборка тоже проходит, а поведение другое.
          docker run --rm --network=none --entrypoint sh "$image" -ec '
            grep -a -q -E -- "-tags=([^[:space:]]*,)?http2legacy" /usr/bin/xray-smux
            grep -a -q -E "=>[[:space:]]+\./third_party/reality[[:space:]]" /usr/bin/xray-smux
          '

      - name: Проверить ядро и зависимости MASQUE
        if: matrix.service == 'masque'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-masque:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sh scripts/ci_retry.sh docker pull "$image"
          expected=$(sed -n 's/^MASQUE_XRAY_VERSION=//p' .env)
          actual=$(docker run --rm --network=none --entrypoint /usr/local/bin/xray "$image" version)
          read -r name version rest <<< "$actual"
          test "$name" = Xray
          test "$version" = "${expected#v}"
          [[ "$actual" == *vpnbot-masque.1* ]]
          docker run --rm --network=none --entrypoint sh -v "$PWD/scripts:/scripts:ro" "$image" -ec '
            openssl version
            python3 -c "import sys; sys.path.insert(0, '\''/scripts'\''); from masque_service import MasqueSupervisor"
            sha256sum /usr/local/bin/xray
          '
          container=$(docker create --entrypoint /usr/local/bin/xray "$image" version)
          docker cp "$container:/usr/local/bin/xray" "$RUNNER_TEMP/xray-masque"
          docker rm "$container"

      - name: Проверить DNS-маршрут до запуска OpenConnect
        if: matrix.service == 'ad'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-ad:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sh scripts/ci_retry.sh docker pull "$image"
          docker run --rm --network=none --entrypoint sh -e VPNBOT_IMAGE_TEST=1 \
            -v "$PWD/tests/adguard_routes_test.sh:/test.sh:ro" \
            -v "$PWD/scripts/start_ad.sh:/entrypoint-under-test.sh:ro" \
            "$image" /test.sh

      - name: Проверить остановку и восстановление AdGuard
        if: matrix.service == 'ad'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-ad:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --network=none --entrypoint sh -e VPNBOT_IMAGE_TEST=1 \
            -v "$PWD/tests/adguard_lifecycle_test.sh:/test.sh:ro" \
            -v "$PWD/app/adguard_control.sh:/control-under-test.sh:ro" \
            "$image" /test.sh

      # Режим WARP через MASQUE целиком зависит от образа wg: openssl для ключа
      # устройства, ядро прокси с поддержкой WARP в MASQUE и то, что оно
      # принимает конфиг, собранный скриптом режима. Cloudflare не нужен.
      - name: Проверить режим WARP через MASQUE в образе wg
        if: matrix.service == 'wg'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-wg:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sh scripts/ci_retry.sh docker pull "$image"
          expected=$(sed -n 's/^XRAY_VERSION=//p' .env)
          actual=$(docker run --rm --network=none --entrypoint warp-socks "$image" version)
          read -r name version rest <<< "$actual"
          test "$name" = Xray
          test "$version" = "${expected#v}"
          docker run --rm --network=none --entrypoint sh \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/tests/warp_masque_image_test.sh:/test.sh:ro" \
            "$image" /test.sh

      - name: Проверить ядро и клиентский комплект snolc
        if: matrix.service == 'snolc'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-snolc:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sh scripts/ci_retry.sh docker pull "$image"
          # Сервер — Alpine, ядро и модули собраны под musl из закреплённых исходников.
          docker run --rm --network=none --entrypoint sh "$image" -ec '
            grep -Ex "3\\.24\\.[0-9]+" /etc/alpine-release
            test "$(/opt/snolc/runtime/bin/snolc --version)" = "snolc 0.0.4+vpnbot.4 wire 1"
            for module in adapter-direct carrier-ssh protection-noise policy-local; do
              grep -qx "\"target\" = \"x86_64-unknown-linux-musl\"" "/opt/snolc/runtime/packages/locks/owenewans/$module/0.0.4.toml"
            done
            cd / && python3 -c "from snolc_service import SnolcSupervisor"
            # Список пакетов Cargo (cargo auditable) для шлюза Trivy: ядро и опись модулей.
            for binary in /opt/snolc/runtime/bin/snolc /opt/snolc/sbom/vpnbot-snolc-modules; do
              grep -q "dep-v0" "$binary"
            done
          '
          # Клиентский комплект собран для glibc: его ядро запускается на самом runner.
          container=$(docker create --network=none "$image")
          docker cp "$container:/opt/snolc/client-patches.zip" "$RUNNER_TEMP/snolc-client.zip"
          docker rm "$container"
          python3 - "$RUNNER_TEMP/snolc-client.zip" "$RUNNER_TEMP/snolc-client" <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as bundle:
              manifest = json.loads(bundle.read('manifest.json'))
              assert manifest['version'] == '0.0.4+vpnbot.4'
              for name, digest in manifest['sha256'].items():
                  assert hashlib.sha256(bundle.read(name)).hexdigest() == digest, name
              # Ядро и все модули клиента — из исходников, под glibc.
              built = ['snolc'] + ['libsnolc_' + m + '.so' for m in ('adapter_socks5', 'carrier_ssh', 'protection_noise', 'policy_local')]
              for name in built:
                  assert name in manifest['sha256'], name + ' is not built from source'
                  assert b'GLIBC_' in bundle.read(name), name + ' is not a glibc build'
              core = bundle.read('snolc')
          assert b'/lib64/ld-linux-x86-64.so.2' in core[:4096], 'client core is not a glibc build'
          with open(sys.argv[2], 'wb') as stream:
              stream.write(core)
          os.chmod(sys.argv[2], 0o700)
          version = subprocess.run([sys.argv[2], '--version'], capture_output=True, check=True, timeout=10).stdout.strip()
          assert version == b'snolc 0.0.4+vpnbot.4 wire 1', version
          print('snolc client:', version.decode())
          PY

      - name: Проверить стабильную базу VPN-образов
        if: contains(fromJSON('["wg","oc","ovpn","ipsec"]'), matrix.service)
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sh scripts/ci_retry.sh docker pull "$image"
          docker run --rm --network=none --entrypoint sh "$image" -ec '
            grep -Ex "3\\.24\\.[0-9]+" /etc/alpine-release
            test -s /etc/apk/repositories
            ! grep -Ev "^https?://[^ ]+/alpine/v3\\.24/(main|community)$|^#|^[[:space:]]*$" /etc/apk/repositories
            ! command -v go
          '
          if [[ "$IMAGE_NAME" == ipsec ]]; then
            # start_ipsec запускает charon по абсолютному пути. Проверка
            # восстановления должна находить его через pgrep -x по имени.
            docker run --rm --network=none --entrypoint sh "$image" -ec '
              /bin/sleep 30 & child=$!
              trap "kill $child 2>/dev/null || true" EXIT
              # Дочерний процесс становится sleep не мгновенно: до exec он ещё sh.
              waited=0
              until [ "$(cat /proc/$child/comm 2>/dev/null)" = sleep ] || [ "$waited" -ge 50 ]; do
                waited=$((waited + 1)); sleep 0.1
              done
              pgrep -x sleep | grep -qx "$child"
            '
          fi

      - name: Идентификатор проверенного образа
        env:
          METADATA: ${{ steps.image.outcome == 'success' && steps.image.outputs.metadata || steps.image_retry.outputs.metadata }}
          SERVICE: ${{ matrix.service }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          e=os.environ; digest=json.loads(e['METADATA'])[e['SERVICE']]['containerimage.digest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',digest)
          value=dict(image=e['IMAGE_NAME'],digest=digest,source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=int(e['GITHUB_RUN_ATTEMPT']))
          path=pathlib.Path(e['RUNNER_TEMP'])/'descriptor';path.mkdir()
          (path/(e['IMAGE_NAME']+'.json')).write_text(json.dumps(value))
          PY
      - uses: ./.github/actions/upload-artifact
        with:
          name: descriptor-${{ matrix.image }}
          path: ${{ runner.temp }}/descriptor/*.json
      - name: Освободить локальную копию проверенного образа на резервном runner
        if: always() && inputs.test_runner
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker image inspect "$image" >/dev/null 2>&1; then
            docker image rm "$image"
          fi
  bundle:
    needs: build
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    outputs:
      fingerprint: ${{ steps.manifest.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Trivy не видит программы, собранные из исходников на C, готовые
      # бинарники на Rust и объявления безопасности самих приложений.
      - name: Известные уязвимости и свежесть закреплённых версий
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 scripts/ci_check_components.py
      # Адреса боевых серверов и другие приметы установки известны только
      # своему runner (файл /etc/vpnbot-ci-private-markers): ни в репозиторий,
      # ни в секреты GitHub они не кладутся. Остальные правила те же, что в тестах.
      - name: Секреты и приметы установки в файлах репозитория
        run: python3 scripts/ci_scan_layers.py --tree .
      - uses: ./.github/actions/download-artifact
        with:
          pattern: descriptor-*
          merge-multiple: true
          path: ${{ runner.temp }}/descriptors
      - id: manifest
        run: |
          set -euo pipefail
          hash=$(python3 scripts/image_bundle.py collect "$RUNNER_TEMP/descriptors" "$RUNNER_TEMP/bundle.json" --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT")
          echo "fingerprint=$hash" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/upload-artifact
        with:
          name: image-bundle
          path: ${{ runner.temp }}/bundle.json
  security:
    needs: bundle
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [ng, php, wg, ad, telemt, xr, oc, np, ss, dnstt, ovpn, ipsec, tt, hysteria, protocol, mieru, snolc, masque]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifact
        with:
          name: image-bundle
          path: ${{ runner.temp }}
      - name: Проверка CVE точного digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/bundle.json"))["images"][os.environ["IMAGE_NAME"]])')
          bash scripts/ci_scan_image.sh "$image"
      # Trivy ищет секреты в итоговой файловой системе. Здесь каждый слой
      # разбирается отдельно: ключ, удалённый поздним слоем, остаётся в раннем.
      - name: Секреты и конфиденциальные данные в слоях
        env:
          IMAGE_NAME: ${{ matrix.image }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/bundle.json"))["images"][os.environ["IMAGE_NAME"]])')
          python3 scripts/ci_scan_layers.py "$image"
  native:
    # security в зависимостях: при нескольких runner сетевой стенд не должен
    # делить машину с параллельными проверками CVE.
    needs: [bundle, tests, security]
    if: github.repository == 'axiomshiftbit/vpnbot' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit'))
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifact
        with:
          name: image-bundle
          path: ${{ runner.temp }}
      - name: Подготовить одноразовую виртуальную машину
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            # Только стандартные ненужные SDK свежего GitHub runner.
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          else
            test "$(cat /etc/vpnbot-ci-test-host)" = home-build
          fi
          sh scripts/ci_retry.sh sudo apt-get update -qq
          sh scripts/ci_retry.sh sudo apt-get install -y python3-yaml python3-cryptography tcpdump curl openssl iptables kmod
          sudo modprobe wireguard
          sudo modprobe l2tp_ppp
          sudo modprobe -a xt_comment xt_mark xt_connmark
          sudo mkdir -p /dev/net
          test -c /dev/net/tun || sudo mknod /dev/net/tun c 10 200
          test -c /dev/ppp || sudo mknod /dev/ppp c 108 0
      - uses: ./.github/actions/registry-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Загрузить точные образы и проверенные тестовые клиенты
        run: python3 scripts/ci_hosted_test.py assets ${{ inputs.test_runner && '--local-test' || '' }} --manifest "$RUNNER_TEMP/bundle.json"
      - name: Удалить доступ к registry перед запуском VPN-стенда
        if: always()
        run: docker logout ghcr.io
      - name: Чистая установка, протоколы, бэкап, восстановление и откат
        run: |
          sudo env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci_hosted_test.py test ${{ inputs.test_runner && '--local-test' || '' }} \
            --manifest "$RUNNER_TEMP/bundle.json" --output "$RUNNER_TEMP/native.json"
      - uses: ./.github/actions/upload-artifact
        with:
          name: native-admission
          path: ${{ runner.temp }}/native.json
      - name: Удалить одноразовые ключи, конфиги и бэкапы
        if: always()
        run: |
          if sudo test -f /opt/vpnbot-hosted-ci/owner; then
            sudo env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              python3 scripts/ci_hosted_test.py cleanup ${{ inputs.test_runner && '--local-test' || '' }}
          fi
  publish:
    needs: [build, tests, bundle, security, native]
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifact
        with:
          name: image-bundle
          path: ${{ runner.temp }}/release
      - uses: ./.github/actions/download-artifact
        with:
          name: native-admission
          path: ${{ runner.temp }}
      - uses: ./.github/actions/setup-buildx
      - uses: ./.github/actions/registry-login
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Допуск, защита от устаревшего запуска, атомарная публикация комплекта
        env:
          CHECKS: '{"build":"${{ needs.build.result }}","tests":"${{ needs.tests.result }}","security":"${{ needs.security.result }}","native":"${{ needs.native.result }}"}'
          EXPECTED_BUNDLE: ${{ needs.bundle.outputs.fingerprint }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_publish_bundle.py "$RUNNER_TEMP/release/bundle.json" "$RUNNER_TEMP/native.json"
  # Только по флажку и только после публикации комплекта dev: master двигается
  # вперёд на проверенный коммит, затем короткий прогон master переносит канал.
  # Права встроенного токена не расширяются — работает отдельный PROMOTE_TOKEN.
  release:
    needs: publish
    if: github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && github.ref == 'refs/heads/dev' && inputs.test_runner && inputs.promote_master
    runs-on: [self-hosted, Linux, X64, vpnbot-home]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Передвинуть master на проверенный коммит и запустить перенос комплекта
        env:
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: python3 scripts/ci_promote_master.py
  cleanup-artifacts:
    needs: [publish, release]
    if: always() && github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.test_runner && needs.publish.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: [self-hosted, Linux, X64, vpnbot-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Удалить промежуточные JSON завершённого запуска
        run: |
          sudo env -i PATH=/usr/bin:/bin \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            python3 scripts/ci_local_artifacts.py cleanup
# Old sha-only garbage collection could delete images referenced by a retained
# bundle. Keep released candidates until a bundle-aware retention job is added.
