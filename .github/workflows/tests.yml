# Прогон тестов и линтера на каждый push.
#
# Отдельный workflow проверяет также PR без запуска VPN-стенда.
# images.yml вызывает этот же набор через workflow_call перед допуском образов.
#
# PHP берём предустановленный на раннере, без сторонних setup-action: тестам
# нужен CLI и yaml для проверки реальных подписок mihomo. ssh2 и intl
# необязательны: соответствующие тесты учитывают их отсутствие.

name: tests

on:
  pull_request:
  # Только тесты, без сборки и публикации: Actions → tests → Run workflow.
  workflow_dispatch:
    inputs:
      home_runner:
        description: 'Home Runner — на домашней VM home-build (только для axiomshiftbit). Без отметки — на серверах GitHub'
        type: boolean
        default: true
  workflow_call:
    inputs:
      home_runner:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.home_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Подготовить PHP CLI резервного тестового runner
        if: (runner.environment == 'self-hosted')
        run: |
          test "$(cat /etc/vpnbot-ci-test-host)" = home-build
          sh scripts/ci_retry.sh sudo apt-get update -qq
          sh scripts/ci_retry.sh sudo apt-get install -y php-cli php-curl php-mbstring php-xml php-zip php-intl php-sqlite3

      - name: Версия PHP
        run: php -v

      - name: YAML для проверки подписок
        run: |
          php_version=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
          sh scripts/ci_retry.sh sudo apt-get update -qq
          sh scripts/ci_retry.sh sudo apt-get install -y "php${php_version}-yaml" python3-yaml curl jq
          php -r 'exit(extension_loaded("yaml") ? 0 : 1);'

      - name: Xray для проверки конфигураций
        run: |
          set -euo pipefail
          xray_test_dir="$RUNNER_TEMP/vpnbot-xray"
          mkdir -p "$xray_test_dir"
          cd "$xray_test_dir"
          sh "$GITHUB_WORKSPACE/dockerfile/download-file.sh" "https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip" Xray-linux-64.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  Xray-linux-64.zip' | sha256sum --check
          unzip -q Xray-linux-64.zip xray
          chmod +x xray
          # Форк-ядро того же пина, что XRAY_FORK_VERSION в .env: xray_fork_core_test
          # сверяет версию и отказывает, если пин обновили, а эту ссылку — нет.
          sh "$GITHUB_WORKSPACE/dockerfile/download-file.sh" "https://github.com/Jolymmiles/Xray-core/releases/download/v26.11.1-1424/Xray-linux-64.zip" Xray-fork-linux-64.zip
          echo 'b70be1d4c83932de1c49c7c68c3da67b2d2c2e1ef11d9a80f207e93cf2fb0d25  Xray-fork-linux-64.zip' | sha256sum --check
          mkdir -p fork && unzip -q Xray-fork-linux-64.zip xray -d fork
          chmod +x fork/xray
          sudo install -d -m 1777 /logs
          echo "VLESS_TEST_XRAY=$xray_test_dir/xray" >> "$GITHUB_ENV"
          echo "XRAY_FORK_TEST_BINARY=$xray_test_dir/fork/xray" >> "$GITHUB_ENV"

      - name: Синтаксис
        run: |
          set -euo pipefail
          for f in app/*.php app/panel/*.php tests/*.php; do
            php -l "$f" > /dev/null
          done
          echo "php -l: чисто"

      - name: Тесты
        env:
          # Проверка доверенных путей допускает sticky /tmp, но не общие
          # каталоги runner с правом записи группы.
          TMPDIR: /tmp
        run: |
          python3 -m unittest discover -s tests -p '*_test.py' || exit 1
          # /logs общий для четырёх пользователей runner. Сохраняем настоящие
          # flock-проверки, но исключаем чужие файлы от предыдущего задания.
          sudo unshare --mount --propagation private bash -s -- \
            "$(id -u)" "$(id -g)" "$VLESS_TEST_XRAY" "$XRAY_FORK_TEST_BINARY" <<'BASH'
          set -euo pipefail
          mount -t tmpfs -o mode=1777,nodev,nosuid,size=128m tmpfs /logs
          fail=0
          for f in tests/*_test.php; do
            if out=$(setpriv --reuid="$1" --regid="$2" --init-groups \
              env TMPDIR=/tmp VLESS_TEST_XRAY="$3" XRAY_FORK_TEST_BINARY="$4" php "$f" 2>&1); then
              echo "ok   $(basename "$f")"
            else
              fail=1
              echo "FAIL $(basename "$f")"
              echo "$out"
            fi
          done
          exit $fail
          BASH

  alpine:
    runs-on: ${{ github.repository == 'axiomshiftbit/vpnbot' && github.event_name == 'workflow_dispatch' && github.actor == 'axiomshiftbit' && inputs.home_runner && fromJSON('["self-hosted","Linux","X64","vpnbot-home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['84', '85']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Инструменты проверяемой загрузки архивов
        run: |
          sh scripts/ci_retry.sh sudo apt-get update -qq
          sh scripts/ci_retry.sh sudo apt-get install -y curl jq

      - name: Xray для проверки конфигураций
        run: |
          set -euo pipefail
          xray_test_dir="$RUNNER_TEMP/vpnbot-xray"
          mkdir -p "$xray_test_dir"
          cd "$xray_test_dir"
          sh "$GITHUB_WORKSPACE/dockerfile/download-file.sh" "https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip" Xray-linux-64.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  Xray-linux-64.zip' | sha256sum --check
          unzip -q Xray-linux-64.zip xray
          chmod +x xray
          # Форк-ядро того же пина, что XRAY_FORK_VERSION в .env: xray_fork_core_test
          # сверяет версию и отказывает, если пин обновили, а эту ссылку — нет.
          sh "$GITHUB_WORKSPACE/dockerfile/download-file.sh" "https://github.com/Jolymmiles/Xray-core/releases/download/v26.11.1-1424/Xray-linux-64.zip" Xray-fork-linux-64.zip
          echo 'b70be1d4c83932de1c49c7c68c3da67b2d2c2e1ef11d9a80f207e93cf2fb0d25  Xray-fork-linux-64.zip' | sha256sum --check
          mkdir -p fork && unzip -q Xray-fork-linux-64.zip xray -d fork
          chmod +x fork/xray

      # Проверяем целевой PHP на musl и прежнюю ветку для совместимости кода
      # при обновлении. bash/util-linux/pcntl нужны тестовым fixtures и
      # проверке хостовых скриптов; в рабочий PHP-образ они не добавляются.
      # openssh-keygen: start_php.sh выдаёт сервисам ключи узлов SSH.
      - name: Все тесты на Alpine и PHP ${{ matrix.php }}
        env:
          PHP_SERIES: ${{ matrix.php }}
        run: |
          set -euo pipefail
          base=$(sed -n 's/^IMAGE=//p' .env)
          sh scripts/ci_retry.sh docker pull "$base"
          docker run --rm --init \
            -v "$PWD:/workspace" \
            -v "$PWD/config/php.ini:/etc/php${PHP_SERIES}/php.ini:ro" \
            -v "$RUNNER_TEMP/vpnbot-xray/xray:/audit-xray:ro" \
            -v "$RUNNER_TEMP/vpnbot-xray/fork/xray:/audit-xray-fork:ro" \
            -e PHP_SERIES -e VLESS_TEST_XRAY=/audit-xray -e XRAY_FORK_TEST_BINARY=/audit-xray-fork -w /workspace \
            "$base" sh -ec '
              sh scripts/ci_retry.sh apk add --no-cache bash util-linux coreutils findutils make git curl jq openssl openssh-keygen python3 py3-yaml \
                php${PHP_SERIES} php${PHP_SERIES}-mbstring php${PHP_SERIES}-session \
                php${PHP_SERIES}-phar php${PHP_SERIES}-zip php${PHP_SERIES}-curl \
                php${PHP_SERIES}-openssl php${PHP_SERIES}-iconv php${PHP_SERIES}-intl \
                php${PHP_SERIES}-pecl-ssh2 php${PHP_SERIES}-pecl-yaml php${PHP_SERIES}-pcntl php${PHP_SERIES}-sodium php${PHP_SERIES}-tokenizer php${PHP_SERIES}-pdo php${PHP_SERIES}-pdo_sqlite
              ln -sf /usr/bin/php${PHP_SERIES} /usr/bin/php
              mkdir -p /logs
              php -v
              python3 -m unittest discover -s tests -p "*_test.py"
              for f in app/*.php app/panel/*.php tests/*.php; do
                php -d error_reporting=32767 -l "$f" >/dev/null
              done
              failed=0
              for f in tests/*_test.php; do
                if output=$(php -d error_reporting=32767 -d error_log=/dev/stderr -d display_errors=1 "$f" 2>&1); then
                  if printf "%s" "$output" | grep -q "Deprecated:"; then
                    echo "DEPRECATED $f"; printf "%s\n" "$output"; failed=1
                  fi
                else
                  echo "FAIL $f"; printf "%s\n" "$output"; failed=1
                fi
              done
              exit "$failed"
            '
