# Прогон тестов и линтера на каждый push.
#
# Зачем отдельный workflow, а не job в images.yml: тот триггерится только на
# правки dockerfile/**, .env и docker-compose.yml, то есть на изменения PHP не
# запускается вовсе. А в tests/ полсотни файлов, каждый закрывает конкретную
# закрытую регрессию (в шапке файла написано, какую), и до сих пор их не звал
# никто: ни CI, ни makefile, ни readme. Правка ломала охрану, поставленную
# полгода назад, и узнать об этом было неоткуда.
#
# PHP берём предустановленный на раннере, без сторонних setup-action: тестам
# нужен CLI и yaml для проверки реальных подписок mihomo. ssh2 и intl
# необязательны: соответствующие тесты учитывают их отсутствие.

name: tests

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Версия PHP
        run: php -v

      - name: YAML для проверки подписок
        run: |
          php_version=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
          sudo apt-get update -qq
          sudo apt-get install -y "php${php_version}-yaml"
          php -r 'exit(extension_loaded("yaml") ? 0 : 1);'

      - name: Xray для проверки конфигураций
        run: |
          set -euo pipefail
          xray_test_dir="$RUNNER_TEMP/vpnbot-xray"
          mkdir -p "$xray_test_dir"
          cd "$xray_test_dir"
          curl --fail --location --retry 3 -o Xray-linux-64.zip https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip
          echo '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df  Xray-linux-64.zip' | sha256sum --check
          unzip -q Xray-linux-64.zip xray
          chmod +x xray
          sudo install -d -m 1777 /logs
          echo "VLESS_TEST_XRAY=$xray_test_dir/xray" >> "$GITHUB_ENV"

      - name: Синтаксис
        run: |
          set -euo pipefail
          for f in app/*.php app/panel/*.php tests/*.php; do
            php -l "$f" > /dev/null
          done
          echo "php -l: чисто"

      - name: Тесты
        run: |
          fail=0
          for f in tests/*_test.php; do
            if out=$(php "$f" 2>&1); then
              echo "ok   $(basename "$f")"
            else
              fail=1
              echo "FAIL $(basename "$f")"
              echo "$out"
            fi
          done
          exit $fail
