<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpnbot panel</title>
<style>
:root{
  --bg:#0e1621; --panel:#17212b; --bubble:#182533; --own:#2b5278; --text:#e9edf1;
  --dim:#7f91a4; --line:#22303c; --accent:#3b82c4; --btn:#20303f; --btnh:#2a445c;
  --danger:#f0555f; --danger-bg:rgba(240,85,95,.16); --shadow:0 2px 10px rgba(0,0,0,.22);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eef1f5; --panel:#fff; --bubble:#fff; --own:#d7ecff; --text:#12212f;
         --dim:#66788a; --line:#dde3ea; --accent:#2f6fa8; --btn:#f0f3f7; --btnh:#e2e8f0;
         --danger:#d5333d; --danger-bg:rgba(213,51,61,.10); --shadow:0 2px 10px rgba(20,30,45,.08); }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font-family:inherit}
button{transition:background .15s,filter .15s,transform .05s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;box-shadow:var(--shadow)}
header b{font-weight:600;letter-spacing:.2px}
header .sp{flex:1}
header button{background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px}
header button:hover{background:var(--btnh)}
#out:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
#dot{transition:color .3s}
#feed{flex:1 1 auto;overflow-y:auto;padding:16px 14px 6px;display:flex;flex-direction:column;gap:11px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#feed::-webkit-scrollbar{width:9px}
#feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid var(--bg)}
.msg{position:relative;max-width:min(820px,95%);align-self:flex-start;background:var(--bubble);
  border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 30px 9px 13px;
  word-wrap:break-word;overflow-wrap:anywhere;box-shadow:var(--shadow);animation:msgin .12s ease-out}
.msg.own{align-self:flex-end;background:var(--own);border-color:transparent;border-radius:14px 14px 4px 14px;padding:9px 30px 9px 13px}
@keyframes msgin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.msg .del{position:absolute;top:6px;right:6px;width:19px;height:19px;line-height:17px;text-align:center;
  border-radius:50%;background:var(--danger-bg);border:1px solid transparent;color:var(--danger);cursor:pointer;
  font-size:13px;font-weight:600;opacity:.55;transition:opacity .15s,background .15s,border-color .15s,transform .1s}
.msg:hover .del{opacity:1}
.msg .del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.msg .del:active{transform:scale(.88)}
.msg .body{white-space:normal}
.msg .body pre{white-space:pre-wrap;background:rgba(127,145,164,.14);padding:8px;border-radius:6px;margin:6px 0;overflow-x:auto}
/* pre-wrap, а не normal: бот выравнивает колонки пробелами (alignColumns) и
   заворачивает такие блоки — статусы сервисов, версии — в <code>. При normal
   браузер схлопывал кратные пробелы и таблицы слипались в сплошной текст.
   Парная правка в Panel::renderText(): <code> исключён из nl2br, иначе перенос
   считался бы дважды. Пузырь не растянется: pre-wrap переносит по пробелам,
   а элемент остаётся инлайновым (overflow к нему всё равно неприменим). */
.msg .body code{background:rgba(127,145,164,.16);padding:1px 4px;border-radius:4px;cursor:pointer;white-space:pre-wrap}
.msg .body blockquote{border-left:3px solid var(--accent);margin:6px 0;padding:2px 0 2px 10px;color:var(--dim)}
.msg .body a{color:var(--accent)}
.msg .body .tg-spoiler{background:var(--dim);color:transparent;border-radius:3px;cursor:pointer}
.msg .body .tg-spoiler.show{background:transparent;color:inherit}
.msg .time{color:var(--dim);font-size:11px;margin-top:4px}
.kb{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.kb .row{display:flex;gap:5px;flex-wrap:wrap}
.kb button,.kb a{flex:1 1 120px;background:var(--btn);border:1px solid var(--line);color:var(--text);border-radius:9px;
  padding:8px 10px;cursor:pointer;font-size:13px;text-align:center;text-decoration:none;min-width:0;word-break:break-word;transition:background .15s,transform .05s}
.kb button:hover,.kb a:hover{background:var(--btnh)}
.kb button:active,.kb a:active{transform:scale(.97)}
.kb button:disabled{opacity:.5;cursor:default;transform:none}
.att img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.att a{display:inline-block;margin-top:6px;color:var(--accent)}
footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:9px 14px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
#replybar{display:none;font-size:12px;color:var(--accent);padding-bottom:6px}
#replybar.on{display:block}
.inputrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
#text{flex:1;resize:none;min-height:38px;max-height:160px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;transition:border-color .15s}
#text:focus-visible{border-color:var(--accent)}
.inputrow button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 15px;cursor:pointer}
.inputrow button:hover{filter:brightness(1.08)}
.inputrow label{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;transition:background .15s}
.inputrow label:hover{background:var(--btnh)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#111a24ee;color:#fff;
  padding:10px 16px;border-radius:10px;max-width:80%;display:none;z-index:5;white-space:pre-wrap;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#busy{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),#6fb3ea);transition:width .2s;z-index:6;box-shadow:0 0 6px var(--accent)}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:10}
#login.on{display:flex;animation:msgin .18s ease-out}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:320px;max-width:92%;box-shadow:0 8px 32px rgba(0,0,0,.28)}
@media (prefers-color-scheme: light){ #login form{box-shadow:0 8px 32px rgba(20,30,45,.14)} }
#login h1{font-size:17px;margin:0 0 14px;font-weight:600}
#login input,#login select{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;transition:border-color .15s}
#login input:focus-visible,#login select:focus-visible{border-color:var(--accent)}
#login select{margin-bottom:10px}
#login button{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px;cursor:pointer;font-weight:600}
#login button:hover{filter:brightness(1.08)}
#login .err,#login .note{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px;white-space:pre-wrap}
#login .note{color:var(--dim)}
#who{color:var(--dim);font-size:12px}
#upcap{display:block;flex:1 1 100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;font:12px inherit;margin-top:6px;transition:border-color .15s}
#upcap:focus-visible{border-color:var(--accent)}
</style>
</head>
<body>
<div id="busy"></div>
<header>
  <b>vpnbot</b><span id="dot" style="color:var(--dim)">•</span>
  <span id="who"></span>
  <span class="sp"></span>
  <button id="menu">/menu</button>
  <button id="clear">очистить</button>
  <button id="out">выход</button>
</header>

<div id="feed"></div>

<footer>
  <div id="replybar"></div>
  <div class="inputrow">
    <textarea id="text" rows="1" placeholder="сообщение или команда"></textarea>
    <label title="отправить файл">📎<input id="file" type="file" hidden></label>
    <button id="send">➤</button>
    <input id="upcap" type="text" placeholder="подпись к файлу (необязательно)">
  </div>
</footer>

<div id="toast"></div>

<div id="login">
  <form id="loginform">
    <h1>Панель управления</h1>
    <select id="adminpick"></select>
    <input id="pass" type="password" placeholder="пароль" autocomplete="current-password">
    <button type="submit">Войти</button>
    <div class="err" id="loginerr"></div>
    <div class="note">{{NOTE}}</div>
  </form>
</div>

<script>
const PREFIX = "{{PREFIX}}";
const ADMINS = JSON.parse("{{ADMINS}}");
let rev = 0, replyTo = 0, replyHint = "", timer = null, inflight = false, ttl = 0;

const $ = id => document.getElementById(id);
const feed = $("feed");

function api(path, body, opts){
  const o = Object.assign({headers:{"X-Panel":"1"}}, opts||{});
  if (body !== undefined){ o.method = "POST"; o.body = body; }
  return fetch(PREFIX + "/" + path, o);
}
function form(obj){
  const f = new FormData();
  for (const k in obj) f.append(k, obj[k]);
  return f;
}
// on: true — неопределённый прогресс (старое поведение), число 0..100 — реальный.
function busy(on){ $("busy").style.width = on === true ? "70%" : on ? on + "%" : "0"; }

function toast(t, alert){
  const el = $("toast");
  el.textContent = t;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", alert ? 6000 : 3000);
}

function atBottom(){ return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120; }

function render(m){
  let el = document.getElementById("m" + m.id);
  if (m.deleted){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement("div");
    el.id = "m" + m.id;
    el.className = "msg" + (m.own ? " own" : "");
    // Лента строго по возрастанию id: правки приходят вперемешку с новыми.
    let next = null;
    for (const c of feed.children) if (+c.id.slice(1) > m.id){ next = c; break; }
    feed.insertBefore(el, next);
  }
  el.innerHTML = "";

  const del = document.createElement("span");
  del.className = "del";
  del.textContent = "×";
  del.title = "убрать из ленты";
  del.onclick = ev => {
    ev.stopPropagation();
    // Это сообщение ждёт ответа (force_reply) — стэш на бэкенде переживёт
    // удаление пузыря, и следующее сообщение уйдёт мимо ожидаемого callback'а.
    if (m.id === replyTo && !confirm("это сообщение ожидает ваш ответ — удалить всё равно?")) return;
    dismiss(m.id);
  };
  el.appendChild(del);

  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = m.html || "";
  el.appendChild(body);

  if (m.attach){
    const a = document.createElement("div");
    a.className = "att";
    if (m.attach.kind === "photo" && m.attach.file){
      const img = document.createElement("img");
      img.src = PREFIX + "/file?id=" + encodeURIComponent(m.attach.file);
      a.appendChild(img);
    } else if (m.attach.file){
      const l = document.createElement("a");
      l.href = PREFIX + "/file?id=" + encodeURIComponent(m.attach.file);
      l.textContent = "⬇ " + (m.attach.name || "файл");
      l.setAttribute("download", m.attach.name || "");
      a.appendChild(l);
    } else if (m.attach.url){
      const l = document.createElement("a");
      l.href = m.attach.url; l.target = "_blank"; l.rel = "noopener";
      l.textContent = m.attach.name || m.attach.url;
      a.appendChild(l);
    }
    el.appendChild(a);
  }

  if (m.buttons && m.buttons.length){
    const kb = document.createElement("div");
    kb.className = "kb";
    for (const row of m.buttons){
      const r = document.createElement("div");
      r.className = "row";
      for (const b of row){
        if (b.cb !== undefined){
          const btn = document.createElement("button");
          btn.textContent = b.text;
          btn.onclick = () => click(m.id, b.cb, btn);
          r.appendChild(btn);
        } else {
          const a = document.createElement("a");
          a.textContent = b.text + (b.webapp ? " ↗" : "");
          a.href = b.url; a.target = "_blank"; a.rel = "noopener";
          r.appendChild(a);
        }
      }
      kb.appendChild(r);
    }
    el.appendChild(kb);
  }

  const t = document.createElement("div");
  t.className = "time";
  t.textContent = new Date((m.date || 0) * 1000).toLocaleTimeString();
  el.appendChild(t);
}

// force_reply: последний живой запрос бота задаёт, куда уйдёт наш ответ.
function refreshReply(){
  let hint = "", to = 0;
  for (let i = feed.children.length - 1; i >= 0; i--){
    const id = +feed.children[i].id.slice(1);
    const m = state[id];
    if (m && m.reply !== null && m.reply !== undefined && !m.own){ hint = m.reply; to = id; break; }
    if (m && m.buttons && m.buttons.length) break;
  }
  replyTo = to; replyHint = hint;
  $("replybar").className = to ? "on" : "";
  $("replybar").textContent = to ? "↩ ответ на запрос: " + (hint || "введите значение") : "";
  $("text").placeholder = hint || "сообщение или команда";
  // В Telegram подпись к файлу можно добавить при отправке ЛЮБОГО документа,
  // а не только когда бот явно её просит (templateAdd — единственный
  // обработчик, которому она обязательна, но заранее не угадать, что ждёт
  // именно её). Поле поэтому всегда доступно и всегда необязательно — как и
  // раньше при исходном prompt() на каждой загрузке.
  $("upcap").placeholder = hint || "подпись к файлу (необязательно)";
}

function dismiss(id){
  const el = document.getElementById("m" + id);
  if (el) el.remove();
  delete state[id];
  api("dismiss", form({message_id:id})).catch(() => {});
}

let state = {};

async function poll(){
  if (inflight) return;
  inflight = true;
  try{
    const r = await api("state?since=" + rev);
    if (r.status === 401){ showLogin(); return; }
    const d = await r.json();
    if (!d.ok) return;
    $("dot").style.color = "var(--accent)";
    const stick = atBottom();
    for (const m of d.messages){
      state[m.id] = m;
      render(m);
      if (m.deleted) delete state[m.id];
    }
    rev = d.rev;
    // Сервер держит последние 300 сообщений и о вытесненных не сообщает —
    // подрезаем ленту сами, иначе за долгую сессию DOM растёт без предела.
    while (feed.children.length > 400){
      const first = feed.firstElementChild;
      delete state[+first.id.slice(1)];
      first.remove();
    }
    if (d.toast) toast(d.toast.text, d.toast.alert);
    if (d.messages.length){ refreshReply(); if (stick) feed.scrollTop = feed.scrollHeight; }
  }catch(e){
    $("dot").style.color = "#e06a6a";
  }finally{ inflight = false; }
}

async function click(id, data, btn){
  if (btn){ btn.disabled = true; }
  busy(true);
  try{
    const r = await api("click", form({message_id:id, data:data}));
    if (r.status === 401) showLogin();
  }catch(e){ toast("сеть недоступна"); }
  finally{ busy(false); if (btn) btn.disabled = false; poll(); }
}

async function send(){
  const t = $("text").value;
  if (!t.trim()) return;
  $("text").value = ""; $("text").style.height = "auto";
  busy(true);
  try{
    const r = await api("text", form({text:t, reply_to:replyTo}));
    if (r.status === 401) showLogin();
  }catch(e){ toast("сеть недоступна"); }
  finally{ busy(false); poll(); }
}

function upload(f){
  const fd = new FormData();
  fd.append("file", f);
  fd.append("reply_to", replyTo);
  fd.append("caption", $("upcap").value);
  $("upcap").value = "";
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", PREFIX + "/upload");
    xhr.setRequestHeader("X-Panel", "1");
    xhr.upload.onprogress = e => { if (e.lengthComputable) busy(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => { if (xhr.status === 401) showLogin(); };
    xhr.onerror = () => toast("не удалось отправить файл");
    xhr.onloadend = () => { busy(false); poll(); resolve(); };
    busy(0);
    xhr.send(fd);
  });
}

let ttlTimer = null;
function fmtTtl(s){
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + "ч " + m + "м" : m + "м";
}
function tickWho(){
  ttl = Math.max(0, ttl - 1);
  const who = $("who");
  who.textContent = (ADMINS.length > 1 ? "от " + who.dataset.admin + " · " : "") + "сессия: " + fmtTtl(ttl);
  if (ttl <= 0) clearInterval(ttlTimer);
}
async function loadDiag(){
  try{
    const r = await api("diag");
    if (!r.ok) return;
    const d = await r.json();
    if (!d.ok) return;
    ttl = d.ttl;
    $("who").dataset.admin = d.admin;
    tickWho();
    clearInterval(ttlTimer);
    ttlTimer = setInterval(tickWho, 1000);
  }catch(e){}
}

function showLogin(){
  $("login").className = "on"; clearInterval(timer); timer = null; clearInterval(ttlTimer);
  $("pass").focus();
}
function start(){
  $("login").className = "";
  if (!timer) timer = setInterval(poll, 1000);
  poll();
  loadDiag();
}

$("send").onclick = send;
$("text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("text").addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 160) + "px";
});
$("file").onchange = function(){ if (this.files[0]) upload(this.files[0]); this.value = ""; };
$("menu").onclick = () => api("text", form({text:"/menu", reply_to:0})).then(poll);
$("clear").onclick = () => {
  if (!confirm("очистить ленту панели? (на настройках бота не сказывается)")) return;
  api("reset", form({})).then(() => { feed.innerHTML = ""; state = {}; rev = 0; poll(); });
};
$("out").onclick = () => api("logout", form({})).then(showLogin);

document.addEventListener("click", e => {
  const spoiler = e.target.closest(".tg-spoiler");
  if (spoiler && !spoiler.classList.contains("show")){
    spoiler.classList.add("show");
    return;
  }
  if (spoiler && e.target.tagName !== "CODE") spoiler.classList.remove("show");
  if (e.target.tagName === "CODE" && navigator.clipboard){
    navigator.clipboard.writeText(e.target.textContent).then(() => toast("скопировано"));
  }
});

document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });

if (ADMINS.length > 1){
  const sel = $("adminpick");
  for (const a of ADMINS){
    const o = document.createElement("option");
    o.value = a; o.textContent = "действовать как " + a;
    sel.appendChild(o);
  }
} else {
  $("adminpick").remove();
}

$("loginform").onsubmit = async e => {
  e.preventDefault();
  $("loginerr").textContent = "";
  const body = {password: $("pass").value};
  if (ADMINS.length > 1) body.admin = $("adminpick").value;
  const r = await api("login", form(body));
  const d = await r.json().catch(() => ({}));
  if (d.ok){ $("pass").value = ""; start(); }
  else $("loginerr").textContent = r.status === 429 ? "слишком много попыток, подождите" : "неверный пароль";
};

if ("{{AUTH}}" === "1") start(); else showLogin();
</script>
</body>
</html>
