http:
  address: 0.0.0.0:80
users:
  - name: admin
    password:
dns:
  bind_hosts:
    - 0.0.0.0
  # tls://, а не голый UDP/53: иначе весь DNS-профиль пользователей уходит с
  # VPS открытым текстом — виден хостеру и транзиту и подделывается на пути.
  # Для сервиса обхода блокировок это ровно тот вектор, от которого клиента
  # защищает DoH-эндпоинт на входе.
  upstream_dns:
    - tls://1.1.1.1
    - tls://8.8.8.8
  trusted_proxies:
    - 10.10.0.0/24
    - 127.0.0.0/8
    - ::1/128
tls:
  certificate_path: /certs/cert_public
  private_key_path: /certs/cert_private
filtering:
  safe_search:
    enabled: false
log:
  file: /logs/adguard
