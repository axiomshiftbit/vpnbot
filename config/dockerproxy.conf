# Брокер Docker API для контейнеров php и service.
#
# Зачем. Раньше /var/run/docker.sock монтировался прямо в php и service с
# суффиксом ":ro". Он не ограничивает НИЧЕГО: read-only относится к иноду
# файла сокета, а не к операциям API — доказательство прямо в коде проекта,
# dockerApi() успешно делает через такой сокет и POST, и DELETE. То есть любой
# дефект в php-контейнере (обработчик Telegram-апдейтов, веб-панель, шаблоны)
# эскалировался до `POST /containers/create` с Binds:["/:/host"] и
# Privileged:true, а это root на хосте.
#
# Почему не tecnativa/docker-socket-proxy. Его haproxy.cfg рубит всё, кроме GET
# и POST (`http-request deny unless METH_GET || { env(POST) -m bool }`), а боту
# нужен DELETE /images/<id> — кнопка очистки образов перестала бы работать.
# Здесь тот же принцип, но allowlist пишется по методу И по пути.
#
# Разрешено ровно то, что зовёт cleanDocker() в app/bot.php, — больше ничего:
#   GET    /images/json
#   GET    /containers/json
#   POST   /images/prune
#   POST   /build/prune
#   DELETE /images/<id>
# Всё остальное (/containers/create, /exec, /volumes, /networks, любой другой
# метод на разрешённом пути) отдаёт 403 и до демона не доходит.

# root, потому что воркер и есть тот, кто открывает /var/run/docker.sock:
# на хосте это srw-rw---- root:docker, а группы docker внутри образа нет —
# воркер под пользователем nginx (uid 100) получил бы EACCES. Контейнер
# одноцелевой: кроме этого прокси в нём ничего не запускается.
user root;
worker_processes 1;
error_log /logs/dockerproxy_error warn;
pid /run/nginx/dockerproxy.pid;

events {
    worker_connections 64;
}

http {
    access_log /logs/dockerproxy_access;

    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        # Второй рубеж после allowlist путей: в сети сборки живут контейнеры,
        # терминирующие недоверенный клиентский трафик, и подсеть у них общая.
        # 10.10.0.7 — php, 10.10.0.15 — service; больше Docker API не нужен
        # никому. Адреса фиксированы в docker-compose.yml (ipv4_address).
        allow 10.10.0.7;
        allow 10.10.0.15;
        deny all;

        proxy_http_version 1.1;
        # Docker отвечает chunked и держит keep-alive; заголовок Connection от
        # клиента пробрасывать нельзя.
        proxy_set_header Connection "";
        proxy_set_header Host localhost;
        # Удаление образа и prune на забитом диске идут неспешно, дефолтных 60с
        # хватает, но пусть будет явно — таймаут здесь безопаснее зависания.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Точные (=) локации выигрывают у регулярки ниже, поэтому /images/json
        # и /images/prune под правило удаления не попадают.
        location = /images/json {
            limit_except GET { deny all; }
            proxy_pass http://docker;
        }

        # Запрос идёт с ?all=1 — query-строка на выбор локации не влияет и
        # уходит на демон как есть (proxy_pass без URI-части).
        location = /containers/json {
            limit_except GET { deny all; }
            proxy_pass http://docker;
        }

        location = /images/prune {
            limit_except POST { deny all; }
            proxy_pass http://docker;
        }

        location = /build/prune {
            limit_except POST { deny all; }
            proxy_pass http://docker;
        }

        # Идентификатор образа приходит как sha256:<hex> либо как имя с тегом.
        # Слэшей внутри нет — вложенные пути (/images/<id>/push и подобные)
        # сюда не подходят намеренно.
        location ~ "^/images/[A-Za-z0-9:_.@-]+$" {
            limit_except DELETE { deny all; }
            proxy_pass http://docker;
        }

        location / {
            deny all;
        }
    }
}
