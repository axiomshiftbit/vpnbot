listen: :443
proxy_protocol: true

tls:
    cert: /certs/cert_public
    key: /certs/cert_private
auth:
    type: password
    password:
quic:
  initStreamReceiveWindow: 8388608
  maxStreamReceiveWindow: 8388608
  initConnReceiveWindow: 20971520
  maxConnReceiveWindow: 20971520
  maxIdleTimeout: 30s
  maxIncomingStreams: 1024
  disablePathMTUDiscovery: false
congestion:
  type: bbr
# Резолвер — внутренний AdGuard (10.10.0.5), как у всех остальных протоколов:
# ocserv (dns = 10.10.0.5 + tunnel-all-dns), shadowsocks (nameserver), openvpn
# (push dhcp-option DNS), xray (гейт 10.10.0.5/32:53 в ensureWgGuard). Hysteria
# была единственной, кто ходил наружу на 1.1.1.1:853: фильтрация и per-client
# политика AdGuard на hysteria-клиентов не действовали, а Cloudflare получал
# полный DNS-профиль всех её пользователей, привязанный к IP сервера. Канал
# внутренний, поэтому tls не нужен.
resolver:
  type: udp
  udp:
    addr: 10.10.0.5:53
    timeout: 10s
disableUDP: false
udpIdleTimeout: 60s
speedTest: false
masquerade:
  type: proxy
  proxy:
    url: https://~domain~
    rewriteHost: true
