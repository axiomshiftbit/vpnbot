user nginx;
worker_processes auto;

error_log /logs/nginx_error;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;
    server_tokens off;
    include override.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Дефолтный combined пишет $request целиком, вместе с query-строкой: в
    # /logs/nginx_tlgrm_access утекал ПОЛНЫЙ токен бота (вебхук проверяется
    # как ?k=<token>), а в nginx_pac_access — subtoken подписок (?s=<stok>).
    # В nginx_webapp_access оседал tg.initData: он уходит query-строкой в
    # POST /webapp$hash/{save,load}, а его поле hash= — валидный пропуск к
    # xray.json и записи шаблонов.
    # $uri — нормализованный путь без аргументов. $remote_addr остаётся первым
    # полем: syncDeny()/xray-фильтр вытаскивают IP регуляркой по первому
    # совпадению, поэтому разбор логов не ломается. Referer исключён: он
    # тоже может содержать секретную ссылку. У защищённых location error_log
    # отключён: сообщения об ошибке 502 раскрывают полный request.
    # Коды ошибок остаются в обезличенном access_log и журнале PHP.
    log_format noargs '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

    # DoH и подписки: путь сам по себе секрет. Клиентский идентификатор едет
    # ПОСЛЕДНИМ сегментом $uri (/dns-query<hashbot>/<id>), поэтому noargs здесь
    # не помогает — он режет только query-строку. До аудита 2026-08-18 там
    # стоял сам uuid клиента (то есть креденшел VLESS) и писался в лог на
    # КАЖДЫЙ DNS-запрос, а /logs смонтирован почти во все контейнеры сборки.
    # Путь выброшен целиком: $remote_addr остаётся первым полем, поэтому сбор
    # «своих» адресов в autoAnalyzeLogs() продолжает работать.
    log_format nopath '$remote_addr [$time_local] "$request_method" '
                      '$status $body_bytes_sent "$http_user_agent"';

    # Proxy Cache storage - so we can cache the DoH response from the upstream
    proxy_cache_path /var/cache/nginx/doh_cache levels=1:2 keys_zone=doh_cache:10m;

    # Одна и та же ws-локация обслуживает два транспорта Vless: websocket (нужен
    # Connection: upgrade) и xhttp (обычный HTTP, апгрейда нет). Ставим заголовок
    # по факту наличия Upgrade у клиента, иначе xhttp получал бы мусорный
    # Connection: upgrade без Upgrade и терял keep-alive к xray.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Пул keep-alive соединений к xray. Без upstream-блока nginx открывает новый
    # TCP на каждый апстрим-запрос, а xhttp в режиме packet-up шлёт десятки
    # коротких POST в секунду. Работает только в паре с proxy_http_version 1.1 и
    # пустым Connection (см. map выше) — для websocket'а апгрейднутое соединение
    # в пул не возвращается, так что WS ничего не теряет.
    # Имя xr резолвится один раз при старте — ровно как и раньше при
    # proxy_pass http://xr:443 (resolver не задан), поведение не меняется:
    # у контейнера статический 10.10.0.9 в docker-compose.
    upstream xr_backend {
        server xr:443;
        keepalive 64;
    }

    # Дефолт 128 маловат: и xhttp (xmux до 32 параллельных), и grpc-туннель
    # укладывают каждый проксируемый коннект в отдельный h2-стрим клиентского
    # соединения.
    http2_max_concurrent_streams 512;

    real_ip_header proxy_protocol;
    real_ip_recursive on;
    set_real_ip_from 10.10.0.10;

    server {
        listen 80 default_server;

        location / {
            return 301 https://$host$request_uri;
        }
        location ~\.well-known {
            access_log /logs/nginx_certbot_access;
            root /certs/;
            try_files $uri =404;
        }
    }

    server {
        listen 10.10.0.2:443 ssl proxy_protocol default_server;
        listen 10.10.0.2:10443 ssl default_server;
        listen 10.10.1.2:443 ssl default_server;
        # Параметр http2 у listen объявлен устаревшим в 1.25.1 (nginx пишет об
        # этом warning на каждый listen при каждом `nginx -t`): он включал h2 на
        # СОКЕТЕ, поэтому два server-блока на одном адресе не могли иметь разный
        # режим — выигрывал первый. Директива http2 работает на уровне server и
        # делает ровно то же самое. Понимается начиная с 1.25.1, то есть и старым
        # образом (1.28.3), и новым (1.30.4): порядок выката не важен.
        http2 on;
        ssl_certificate /certs/self_public;
        ssl_certificate_key /certs/self_private;

        access_log /logs/nginx_ip_access;

        # Заголовки на статике и на всём, что отдаёт этот server. Подписочные
        # ответы ставят их сами (subSecurityHeaders в bot.php), а у /, /override/
        # и /webapp<hash> не было ничего. always — чтобы попадали и в 401/404.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # X-Frame-Options здесь НЕТ намеренно: /webapp<hash> и /adguard<hash>
        # открываются как Telegram Mini App, а в Telegram Web это iframe —
        # DENY сломал бы редактор шаблонов и вход в админку AdGuard.

        # Явно, а не «как получится»: дефолт nginx с 1.23.4 и так TLSv1.2+1.3,
        # но зафиксировать версию протокола в конфиге дешевле, чем однажды
        # обнаружить её сменившейся вместе с версией сервера.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Точечные файлы наружу не отдаём. /webapp<hash> и location / смотрят в
        # ОДИН каталог (app/webapp), но basic-auth стоит только на втором:
        # GET /webapp<hash>/.htpasswd отдавал файл паролей фейк-страницы
        # целиком, а <hash> не секрет — он есть в каждой ссылке подписки.
        # Правило стоит первым: регулярные локации проверяются до префиксных.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = / {
            root /app;
            try_files $uri /override.html @auth;
        }

        location /override/ {
            alias /app/override/;
            try_files $uri =404;
        }

        location / {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }
        location @auth {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }

        location /tlgrm {
            error_log /dev/null;
            access_log /logs/nginx_tlgrm_access noargs;
            proxy_pass http://php;
        }

        location @php {
            error_log /dev/null;
            access_log /logs/nginx_webapp_access noargs;
            proxy_pass http://php;
        }

        location /adguard/ {
        }

        location /webapp {
            error_log /dev/null;
            access_log /logs/nginx_webapp_access noargs;
            alias /app;
            index index.html;
            try_files $uri $uri/ @php;
        }

        location /pac {
            error_log /dev/null;
            access_log /logs/nginx_pac_access nopath;
            proxy_set_header Host $http_host;
            # Единственная локация, где PHP реально читает XFF (subRateLimit()
            # в bot.php). Без этих строк nginx проксирует клиентский заголовок
            # как есть, и лимит выдачи подписок обходится одной строкой в
            # запросе: ключ ведра — hash(sid|ip|scope), смена ip даёт новый
            # счётчик, а в ведре 'miss' (анти-перебор sid) ip вообще
            # единственный переменный компонент. $remote_addr, а не
            # $proxy_add_x_forwarded_for — по той же причине, что у /ws ниже.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://php;
        }

        location /ws {
            proxy_pass http://xr_backend;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # ИМЕННО $remote_addr, а не $proxy_add_x_forwarded_for. Xray доверяет
            # XFF при заданном sockopt.trustedXForwardedFor и берёт из него ПЕРВЫЙ
            # элемент (common/protocol/http/headers.go). $proxy_add_… дописывает
            # реальный IP в КОНЕЦ клиентского значения, т.е. первым остался бы
            # заголовок, присланный самим клиентом, — и любой желающий подменял бы
            # себе IP в access-логе, в журнале подключений и в лимите ip_limit.
            proxy_set_header X-Forwarded-For $remote_addr;
            # Здесь proxy_pass, а не grpc_pass, потому что локация обслуживает
            # ещё и websocket. Из-за этого stream-up (его xray выбрал бы сам при
            # mode=auto + TLS/h2) непригоден — официальная рекомендация для него
            # именно grpc_pass. Поэтому клиент жёстко пинуется на packet-up
            # (см. xhttpClientExtra() в bot.php), а сервер слушает mode=auto.
            # 0, а не конечный размер: даже в packet-up потолок тела тут лишний —
            # размер поста уже ограничен самим xray через scMaxEachPostBytes,
            # а любой предел nginx оборвал бы аплинк, если режим когда-нибудь
            # сменится на потоковый.
            client_max_body_size 0;
            # Каждый POST packet-up — отдельный h2-запрос клиентского
            # соединения; при дефолтных 1000 nginx слал бы GOAWAY через
            # считаные минуты и клиент передоговаривал TLS.
            keepalive_requests 100000;
            # Обязательны оба: без proxy_request_buffering off nginx копил бы
            # POST целиком перед отправкой в xray, без proxy_buffering off —
            # держал бы даунлинк (он у xhttp бесконечный поток). Xray дублирует
            # второе заголовком X-Accel-Buffering: no.
            proxy_request_buffering off;
            proxy_buffering off;
            # Симметрично grpc_socket_keepalive: мёртвые сокеты в пуле должны
            # отваливаться сами, а не отдавать 502 на первом же переиспользовании.
            proxy_socket_keepalive on;
            proxy_read_timeout 5d;
            proxy_send_timeout 5d;
        }

        location /grpc {
            client_max_body_size 0;
            client_body_buffer_size 1m;
            # Каждый проксируемый коннект — отдельный gRPC-стрим, т.е. отдельный
            # запрос в клиентском h2-соединении. Дефолтные 1000 упираются за
            # сессию активного пользователя, дальше GOAWAY и полный передоговор.
            keepalive_requests 100000;
            grpc_pass grpc://xr:443;
            grpc_socket_keepalive on;
            grpc_buffer_size 1m;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            # См. комментарий в /ws: xray берёт первый элемент XFF, поэтому сюда
            # попадает только $remote_addr, без клиентского префикса.
            grpc_set_header X-Forwarded-For $remote_addr;
            grpc_set_header X-Forwarded-Proto $scheme;
            grpc_read_timeout 5d;
            grpc_send_timeout 5d;
        }

        location /v2ray {
            access_log /logs/nginx_v2ray_access;
            proxy_redirect off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_pass http://10.10.0.6:8388/;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /dns-query {
            error_log /dev/null;
            access_log /logs/nginx_doh_access nopath;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $remote_addr;
            proxy_cache doh_cache;
            proxy_cache_key $scheme$proxy_host$uri$is_args$args$request_body;
            proxy_pass https://ad/dns-query;
        }
        include location.conf;
    }

