    # WEB-режим telemt (тип прокси «WEB» в Telegram Desktop, telemt >= 3.5.0).
    # Клиент ходит обычным HTTPS на 443 отдельного FQDN, telemt TLS НЕ
    # терминирует: он слушает plain HTTP/1.1 на приватном порту 8080 (в
    # docker-сеть, наружу не публикуется) и ждёт ровно один разобранный
    # X-Forwarded-For от доверенного пира. Здесь этот пир — ng (10.10.0.2),
    # он же и стоит в web_trusted_proxy_cidrs у telemt.
    #
    # Весь vhost уходит в telemt целиком: decoy-политику (обычный сайт для
    # неаутентифицированных запросов) держит сам telemt, и если выделять ему
    # только carrier-пути, поведение «обычного» и «аутентифицированного»
    # запроса станет различимо снаружи.
    #
    # Таймауты 95s: выше web.timeouts.http_idle_secs у telemt (75s), чтобы
    # жизненным циклом соединения владел telemt, а не фронт. Прежних 35s
    # хватало только на long poll (25s), но WebSocket-carrier молчит между
    # transport-Ping'ами того же интервала, и запас в 10s рвал бы живые сокеты.
    # client_max_body_size >= web.limits.max_body_bytes (2 MiB).
    # access_log off обязателен: в query едут bridge capabilities, а в
    # Authorization — bootstrap/session-креденшелы.
    #
    # Проброс Upgrade нужен carrier'ам websocket и websocket-lanes (telemt
    # >= 3.5.4): они делают GET /api/v1/ws поверх HTTP/1.1 Upgrade. Переменная
    # $connection_upgrade приходит из map в http-контексте выше — объявлять её
    # здесь повторно нельзя, nginx упадёт на duplicate map. Для не-Upgrade
    # запросов map отдаёт пустую строку, и keepalive к telemt сохраняется.
    #
    # http2 on ниже WebSocket'у не мешает и снимать его не надо: h2 нужен
    # carrier'у https-lanes, а апгрейд поверх h2 (RFC 8441) nginx не
    # анонсирует, поэтому клиент сам открывает под WebSocket отдельное
    # HTTP/1.1-соединение — ALPN предлагает оба протокола.
    #
    # Отдельной location для /api/v1/ws быть НЕ должно: cloakNginx() дописывает
    # хеш-суффикс ко всем путям вида /ws, и локация сломалась бы. Апгрейд
    # обслуживает этот же catch-all.
    #
    # Блок между маркерами раскомментирует cloakNginx() — когда включён
    # telemt_web И задан домен с сертификатом. server_name подставляется туда же.
    #-tgweb
