user  nginx;
worker_processes  auto;

load_module /usr/lib/nginx/modules/ngx_stream_module.so;

error_log  /logs/upstream_error;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/deny;
    log_format basic '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received';
    access_log /logs/upstream_access basic;

    upstream other {
        server ng:443;
    }

    upstream reality {
        server xr:443;
    }

    upstream ocserv {
        zone ocserv 64k;
        server 10.10.0.11:443;
    }

    upstream naive {
        server np:443;
    }

    upstream trusttunnel {
        zone trusttunnel 64k;
        server 10.10.0.18:8443;
    }

    upstream openvpn {
        zone openvpn 64k;
        server 10.10.0.19:1194;
    }

    upstream anytls_backend {
        zone anytls_backend 64k;
        server 10.10.0.22:8443;
    }

    upstream anytls_bridge {
        server 127.0.0.1:10444;
    }

    map_hash_bucket_size 128;
    map $ssl_preread_server_name $sni_name {
        #domain
        t reality;
        #domain

        #ocserv
        #oc.domain ocserv;
        #ocserv

        #naive
        #np.domain naive;
        #naive
        default other;

        #anytls
        # disabled
        #anytls
    }

    # Strip the outer PROXY header without terminating TLS.
    server {
        listen 127.0.0.1:10444 proxy_protocol;
        proxy_pass anytls_backend;
        proxy_protocol off;
    }

    server {
        listen          443 reuseport;
        proxy_pass      $sni_name;
        proxy_protocol  on;
        ssl_preread     on;
    }

    server {
        # ssl_preread разбирает TLS по TCP, но не DTLS. UDP-443 выделен
        # OpenConnect; ocserv принимает PROXY protocol только на TCP.
        listen          443 udp reuseport;
        proxy_pass      ocserv;
    }

    # TrustTunnel: отдельный порт, без proxy_protocol (TT его не понимает)..
    # Блок ниже между маркерами перезаписывается ботом — править вручную не нужно.
    #tt-port
    server {
        listen      2443 reuseport;
        proxy_pass  trusttunnel;
    }
    server {
        listen      2443 udp reuseport;
        proxy_pass  trusttunnel;
    }
    #tt-port

    # OpenVPN (UDP-only). Блок между маркерами перезаписывается ботом.
    #ovpn-port
    server {
        listen      1194 udp reuseport;
        proxy_pass  openvpn;
    }
    #ovpn-port
}
