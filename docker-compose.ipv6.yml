# Подключается штатным lifecycle только после scripts/ipv6_egress.py prepare.
# Входящие VPN-порты остаются IPv4. Firewall/NAT66 настраиваются на хосте.
services:
    xr:
        networks:
            ipv6_egress:
                ipv6_address: fd42:7662:6::9
networks:
    ipv6_egress:
        enable_ipv4: false
        enable_ipv6: true
        driver_opts:
            com.docker.network.bridge.name: br-vpnbot6
            com.docker.network.bridge.enable_ip_masquerade: "false"
            # Минимальный MTU IPv6: не зависим от пересылки link-local PTB
            # через NAT66 (ядро Linux не маршрутизирует link-local источник).
            com.docker.network.driver.mtu: "1280"
        ipam:
            config:
                - subnet: fd42:7662:6::/64
                  gateway: fd42:7662:6::1
