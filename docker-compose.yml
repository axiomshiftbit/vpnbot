x-logging:
      &default-logging
      driver: "json-file"
      options:
          max-size: "200k"
          max-file: "10"

networks:
    default:
        ipam:
            config:
                - subnet: 10.10.0.0/24
    xray:
        ipam:
            config:
                - subnet: 10.10.1.0/24
volumes:
    adguard:
    warp:

services:
    up:
        image: ghcr.io/axiomshiftbit/vpnbot-ng:${VPNBOT_TAG:-latest}
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                NGINX_VERSION: ${NGINX_VERSION:-1.30.4}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/upstream.conf:/etc/nginx/nginx.conf
            - ./config/deny:/etc/nginx/deny
            - ./scripts/start_upstream.sh:/start_upstream.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs/:/logs/
        ports:
            - 443:443/tcp
            - 443:443/udp
        hostname: upstream
        container_name: upstream-${VER}
        depends_on:
            ng:
                condition: service_healthy
            xr:
                condition: service_started
            oc:
                condition: service_started
            np:
                condition: service_started
            tt:
                condition: service_started
            ovpn:
                condition: service_started
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_upstream.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.10
        logging: *default-logging
    ng:
        image: ghcr.io/axiomshiftbit/vpnbot-ng:${VPNBOT_TAG:-latest}
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                NGINX_VERSION: ${NGINX_VERSION:-1.30.4}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/nginx.conf:/etc/nginx/nginx.conf
            - ./config/override.conf:/etc/nginx/override.conf
            - ./config/location.conf:/etc/nginx/location.conf
            - ./config/nginx_default.conf:/nginx_default.conf
            - ./scripts/start_ng.sh:/start_ng.sh
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs/:/logs/
            - ./app/webapp:/app
        ports:
            - 80:80
        hostname: nginx
        container_name: nginx-${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ng.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.2
            xray:
                ipv4_address: 10.10.1.2
        logging: *default-logging
        depends_on:
            php:
                condition: service_healthy
            ad:
                condition: service_started
            ss:
                condition: service_started
            xr:
                condition: service_started
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 10s
            timeout: 5s
            retries: 3
    php:
        image: ghcr.io/axiomshiftbit/vpnbot-php:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
        ports:
            - 127.0.0.1:8081:8080
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php84/php.ini
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./app:/app
            - ./logs/:/logs/
            - ./scripts/start_php.sh:/start_php.sh
            - ./scripts/check_file.sh:/check_file.sh
            - ./version:/version
            - ./mirror:/mirror
            - ./.env:/mirror/.env
            - ./update:/update
            - ./.git:/.git
            - ./singbox_windows:/singbox
            - ./docker-compose.override.yml:/docker/compose
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - warp:/etc/warp
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: php
        container_name: php-${VER}
        # restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_php.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.7
        extra_hosts:
            - "host.docker.internal:host-gateway"
        logging: *default-logging
        healthcheck:
            test: ["CMD", "/bin/sh", "/check_file.sh"]
            interval: 5s
            timeout: 5s
            retries: 5
    service:
        image: ghcr.io/axiomshiftbit/vpnbot-php:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php84/php.ini
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./app:/app
            - ./logs/:/logs/
            - ./version:/version
            - ./update:/update
            - ./.git:/.git
            - ./scripts/start_service.sh:/start_service.sh
            - ./docker-compose.override.yml:/docker/compose
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: service
        container_name: service-${VER}
        # restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_service.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.15
        logging: *default-logging
        depends_on:
            - up
            - ng
            - php
            - wg
            - wg1
            - ad
            - xr
            - oc
            - np
            - proxy
            - ss
            - dnstt
            - hy
            - tt
            - ovpn
    wg:
        image: ghcr.io/axiomshiftbit/vpnbot-wg:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                AWG_GO_VERSION: ${AWG_GO_VERSION:-v3.0.20260805}
                AWG_TOOLS_VERSION: ${AWG_TOOLS_VERSION:-v3.0.20260805}
                WGCF_VERSION: ${WGCF_VERSION:-v2.2.32}
                MICROSOCKS_REF: ${MICROSOCKS_REF:-96bf8a87408c36951b73b7957687f42904e620f8}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/wg0.conf:/etc/wireguard/wg0.conf
            # :ro — каталог смонтирован ради чтения /config/pac.json (start_wg.sh,
            # reset_wg.sh). Без него контейнер, терминирующий недоверенный
            # клиентский трафик, имел запись в xray.json, clients.json,
            # ocserv.passwd и credentials.toml. wg0.conf монтируется отдельно.
            - ./config:/config:ro
            - ./scripts/start_wg.sh:/start_wg.sh
            - ./scripts/reset_wg.sh:/reset_wg.sh
            - ./scripts/block_torrent.sh:/block_torrent.sh
            - ./scripts/block_exchange.sh:/block_exchange.sh
            # Только ПУБЛИЧНЫЙ ключ (./ssh/pub кладёт start_php.sh). Полный /ssh
            # содержит и приватный ключ, которым бот заходит root'ом во ВСЕ
            # контейнеры, — а этот контейнер терминирует недоверенный клиентский
            # трафик. start_wg.sh нужен только key.pub для authorized_keys.
            - ./ssh/pub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
        hostname: wireguard
        container_name: wireguard-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            ADDRESS: ${WGADDRESS}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_wg.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.4
        logging: *default-logging
    wg1:
        image: ghcr.io/axiomshiftbit/vpnbot-wg:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                AWG_GO_VERSION: ${AWG_GO_VERSION:-v3.0.20260805}
                AWG_TOOLS_VERSION: ${AWG_TOOLS_VERSION:-v3.0.20260805}
                WGCF_VERSION: ${WGCF_VERSION:-v2.2.32}
                MICROSOCKS_REF: ${MICROSOCKS_REF:-96bf8a87408c36951b73b7957687f42904e620f8}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/wg1.conf:/etc/wireguard/wg0.conf
            # :ro — см. комментарий у wg0-сервиса.
            - ./config:/config:ro
            - ./scripts/start_wg.sh:/start_wg.sh
            - ./scripts/reset_wg.sh:/reset_wg.sh
            - ./scripts/block_torrent.sh:/block_torrent.sh
            - ./scripts/block_exchange.sh:/block_exchange.sh
            # Только публичный ключ — см. комментарий у сервиса wg.
            - ./ssh/pub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
        hostname: wireguard1
        container_name: wireguard1-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            ADDRESS: ${WG1ADDRESS}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_wg.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.14
        logging: *default-logging
    ad:
        image: ghcr.io/axiomshiftbit/vpnbot-ad:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/adguard.dockerfile
            args:
                # Форма :-default обязательна: голое ${ADGUARD_VERSION} при
                # отсутствии переменной передаёт пустую строку, она перекрывает
                # дефолт ARG, и FROM adguard/adguardhome: роняет сборку.
                ADGUARD_VERSION: ${ADGUARD_VERSION:-v0.107.78}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - type: volume
              target: /opt/adguardhome/work
              source: adguard
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/:/config/
            - ./certs/:/certs/
            - ./logs/:/logs/
            - ./scripts/start_ad.sh:/start_ad.sh
        hostname: adguard
        container_name: adguard-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        networks:
            default:
                ipv4_address: 10.10.0.5
        cap_add:
            - NET_ADMIN
        entrypoint: ["/bin/sh", "/start_ad.sh"]
        logging: *default-logging
    telemt:
        image: ghcr.io/axiomshiftbit/vpnbot-telemt:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/telemt.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                TELEMT_VERSION: ${TELEMT_VERSION:-3.4.25}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/telemt:/telemt
            - ./scripts/start_telemt.sh:/start_telemt.sh
            - ./logs:/logs
        hostname: telemt
        container_name: telemt-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_telemt.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.20
        logging: *default-logging
    xr:
        image: ghcr.io/axiomshiftbit/vpnbot-xr:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/xray.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                XRAY_VERSION: ${XRAY_VERSION:-}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/xray.json:/xray.json
            - ./scripts/start_xray.sh:/start_xray.sh
            - ./logs:/logs
        hostname: xray
        container_name: xray-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_xray.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.9
            xray:
                ipv4_address: 10.10.1.9
        logging: *default-logging
    oc:
        image: ghcr.io/axiomshiftbit/vpnbot-oc:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/ocserv.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                OCSERV_VERSION: ${OCSERV_VERSION:-1.5.0}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config:/etc/ocserv
            - ./certs:/certs
            - ./logs:/logs
            - ./scripts/start_oc.sh:/start_oc.sh
        hostname: ocserv
        container_name: openconnect-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_oc.sh"]
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        networks:
            default:
                ipv4_address: 10.10.0.11
        logging: *default-logging
    np:
        image: ghcr.io/axiomshiftbit/vpnbot-np:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/naive.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                # CADDY_VERSION и FORWARDPROXY_VERSION меняются ТОЛЬКО парой:
                # тег плагина = версия caddy + суффикс -naive (см. dockerfile).
                CADDY_GO_VERSION: ${CADDY_GO_VERSION:-1.25}
                XCADDY_VERSION: ${XCADDY_VERSION:-v0.4.5}
                CADDY_VERSION: ${CADDY_VERSION:-v2.11.2}
                FORWARDPROXY_VERSION: ${FORWARDPROXY_VERSION:-v2.11.2-naive}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            # :ro — caddy только читает /config/Caddyfile (пишет его бот из
            # php-контейнера), свои данные держит в /root/.local/share/caddy.
            - ./config:/config:ro
            - ./certs:/certs
            # Нужен для лога caddy (/logs/caddy): его пишет и start_np.sh, и
            # сам caddy блоком `log` из Caddyfile. Без монтирования лог оседал
            # бы в эфемерной ФС контейнера и пропадал при recreate.
            - ./logs/:/logs/
            - ./scripts/start_np.sh:/start_np.sh
        hostname: naive
        container_name: naive-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_np.sh"]
        cap_add:
            - NET_ADMIN
        networks:
            default:
                ipv4_address: 10.10.0.12
        logging: *default-logging
    wp:
        image: ghcr.io/axiomshiftbit/vpnbot-wg:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                AWG_GO_VERSION: ${AWG_GO_VERSION:-v3.0.20260805}
                AWG_TOOLS_VERSION: ${AWG_TOOLS_VERSION:-v3.0.20260805}
                WGCF_VERSION: ${WGCF_VERSION:-v2.2.32}
                MICROSOCKS_REF: ${MICROSOCKS_REF:-96bf8a87408c36951b73b7957687f42904e620f8}
        cap_add:
            - NET_ADMIN
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            # :ro — start_wp.sh только читает /config/pac.json.
            - ./config:/config:ro
            - ./scripts/start_wp.sh:/start_wp.sh
            - ./scripts/warp_fixup.sh:/warp_fixup.sh
            - ./scripts/warp_probe.sh:/warp_probe.sh
            - warp:/etc/warp
        hostname: warp
        container_name: warp-${VER}
        command: ["/bin/sh", "/start_wp.sh"]
        # unless-stopped: упавший warp поднимается сам (ручной docker stop
        # уважается); start_wp.sh делает exit 1, если туннель не оживает.
        restart: unless-stopped
        healthcheck:
            # та же проба, что у watchdog в start_wp.sh (curl-трейс через
            # socks5h, при отсутствии curl — возраст handshake)
            test: ["CMD", "sh", "/warp_probe.sh"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 90s
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        working_dir: /etc/warp
        networks:
            default:
                ipv4_address: 10.10.0.13
        logging: *default-logging
    proxy:
        image: ghcr.io/axiomshiftbit/vpnbot-ss:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/shadowsocks.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/sslocal.json:/config.json
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./scripts/start_proxy.sh:/start_proxy.sh
        hostname: proxy
        container_name: proxy-${VER}
        depends_on:
            php:
                condition: service_healthy
        networks:
            default:
                ipv4_address: 10.10.0.3
        environment:
            TZ: ${TZ}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_proxy.sh"]
        logging: *default-logging
    ss:
        image: ghcr.io/axiomshiftbit/vpnbot-ss:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/shadowsocks.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                # Пустое значение любого из четырёх = releases/latest
                # (прежнее поведение). Значения по умолчанию — то, что стоит
                # в бою; менять здесь не нужно, правьте .env.
                SS_RUST_VERSION: ${SS_RUST_VERSION:-v1.24.0}
                V2RAY_PLUGIN_VERSION: ${V2RAY_PLUGIN_VERSION:-v5.49.0}
                CLOAK_VERSION: ${CLOAK_VERSION:-v2.12.0}
                SIMPLE_TLS_VERSION: ${SIMPLE_TLS_VERSION:-v0.8.0}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/ssserver.json:/config.json
            # :ro — start_ss.sh читает ck/stls-конфиги и пишет только в /tmp;
            # рабочий /config.json смонтирован отдельным файлом выше.
            - ./config:/config:ro
            - ./certs:/certs:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./scripts/start_ss.sh:/start_ss.sh
            - ./logs/:/logs/
        hostname: shadowsocks
        container_name: shadowsocks-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            CKPORT: ${CKPORT:-7443}
            STLSPORT: ${STLSPORT:-3443}
        ports:
            - ${CKPORT:-7443}:${CKPORT:-7443}/tcp
            - ${STLSPORT:-3443}:${STLSPORT:-3443}/tcp
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ss.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.6
        logging: *default-logging
    dnstt:
        image: ghcr.io/axiomshiftbit/vpnbot-dnstt:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/dnstt.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
                DNSTT_REF: ${DNSTT_REF:-0c5c52a57d899c05428c116898941761a2ed83c2}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./logs:/logs
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/dnstt:/dnstt
            - ./scripts/start_dnstt.sh:/start_dnstt.sh
        hostname: dnstt
        container_name: dnstt-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_dnstt.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.16
        logging: *default-logging
    ovpn:
        image: ghcr.io/axiomshiftbit/vpnbot-ovpn:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/openvpn.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/openvpn:/etc/openvpn
            - ./scripts/start_ovpn.sh:/start_ovpn.sh
            # Миграции server.conf отдельным файлом: их дёргает и стартовый
            # скрипт, и бот после восстановления конфигурации из бэкапа.
            - ./scripts/ovpn_migrate.sh:/ovpn_migrate.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs:/logs
        hostname: openvpn
        container_name: openvpn-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            OVPNPORT: ${OVPNPORT:-1194}
            OVPNPROTO: ${OVPNPROTO:-udp4}
            OVPNSUBNET: ${OVPNSUBNET:-10.8.0.0/24}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ovpn.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.19
        logging: *default-logging
    ipsec:
        image: ghcr.io/axiomshiftbit/vpnbot-ipsec:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/ipsec.dockerfile
            args:
                image: ${IMAGE:-alpine:3.23}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/ipsec:/config/ipsec
            - ./scripts/start_ipsec.sh:/start_ipsec.sh
            # Миграции swanctl.conf отдельным файлом: их дёргает и стартовый
            # скрипт, и бот после восстановления конфигурации из бэкапа.
            - ./scripts/ipsec_migrate.sh:/ipsec_migrate.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs:/logs
        hostname: ipsec
        container_name: ipsec-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            # IP обязателен: start_ipsec.sh гейтит на нём выпуск server.crt
            # (SAN=IP) и генерацию swanctl.conf. Из env_file (.env) приходит
            # пустая строка IP= — реальное значение передаёт makefile при
            # `docker compose up` (IP=$(IP) …), поэтому берём его отсюда.
            IP: ${IP}
            L2TPSUBNET: ${L2TPSUBNET:-10.9.1.0/24}
            IKEV2SUBNET: ${IKEV2SUBNET:-10.9.2.0/24}
        cap_add:
            - NET_ADMIN
        # charon ставит XFRM-политики в netns контейнера; форвардинг пакетов
        # клиентов включаем через sysctl (docker разрешает net.ipv4.*).
        sysctls:
            net.ipv4.ip_forward: 1
        # /dev/ppp НЕ пробрасываем устройством: его может не быть на хосте до
        # modprobe ppp_generic, и compose тогда не поднимет контейнер вовсе.
        # start_ipsec.sh делает mknod сам (CAP_MKNOD есть по умолчанию).
        # Для L2TP на хосте должен быть загружен модуль l2tp_ppp (см. nft-конфиг).
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ipsec.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.21
        logging: *default-logging
    tt:
        image: ghcr.io/axiomshiftbit/vpnbot-tt:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/trusttunnel.dockerfile
            args:
                TT_REF: ${TT_REF:-master}
        volumes:
            - ./config/.profile:/root/.bashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/trusttunnel:/trusttunnel_endpoint
            - ./certs:/certs:ro
            - ./logs:/logs
            - ./scripts/start_tt.sh:/start_tt.sh
        hostname: trusttunnel
        container_name: trusttunnel-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        entrypoint: ["/bin/sh", "/start_tt.sh"]
        ports:
            - ${TTPORT:-2443}:8443/tcp
            - ${TTPORT:-2443}:8443/udp
        networks:
            default:
                ipv4_address: 10.10.0.18
        logging: *default-logging
    hy:
        image: ghcr.io/axiomshiftbit/vpnbot-hysteria:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/hysteria.dockerfile
            args:
                # :-default обязателен: пустая подстановка перекрыла бы дефолт
                # ARG, и FROM с пустым тегом уронил бы сборку.
                HYSTERIA_VERSION: ${HYSTERIA_VERSION:-v2.12.0}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./certs:/certs
            - ./logs:/logs
            # :ro — hysteria только читает /config/hysteria.yaml (пишет его бот).
            - ./config:/config:ro
            - ./scripts/start_hysteria.sh:/start_hysteria.sh
        hostname: hysteria
        container_name: hysteria-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_hysteria.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.17
        logging: *default-logging
