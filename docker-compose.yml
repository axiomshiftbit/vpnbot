x-logging:
      &default-logging
      driver: "json-file"
      options:
          max-size: "200k"
          max-file: "10"

networks:
    default:
        ipam:
            config:
                - subnet: 10.10.0.0/24
    xray:
        ipam:
            config:
                - subnet: 10.10.1.0/24
volumes:
    adguard:
    warp:

services:
    up:
        image: mercurykd/vpnbot-ng:1.1
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/upstream.conf:/etc/nginx/nginx.conf
            - ./config/deny:/etc/nginx/deny
            - ./scripts/start_upstream.sh:/start_upstream.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs/:/logs/
        ports:
            - 443:443/tcp
            - 443:443/udp
        hostname: upstream
        container_name: upstream-${VER}
        depends_on:
            ng:
                condition: service_healthy
            xr:
                condition: service_started
            oc:
                condition: service_started
            np:
                condition: service_started
            tt:
                condition: service_started
            ovpn:
                condition: service_started
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_upstream.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.10
        logging: *default-logging
    ng:
        image: mercurykd/vpnbot-ng:1.1
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/nginx.conf:/etc/nginx/nginx.conf
            - ./config/override.conf:/etc/nginx/override.conf
            - ./config/location.conf:/etc/nginx/location.conf
            - ./config/nginx_default.conf:/nginx_default.conf
            - ./scripts/start_ng.sh:/start_ng.sh
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs/:/logs/
            - ./app/webapp:/app
        ports:
            - 80:80
        hostname: nginx
        container_name: nginx-${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ng.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.2
            xray:
                ipv4_address: 10.10.1.2
        logging: *default-logging
        depends_on:
            php:
                condition: service_healthy
            ad:
                condition: service_started
            ss:
                condition: service_started
            xr:
                condition: service_started
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 10s
            timeout: 5s
            retries: 3
    php:
        image: mercurykd/vpnbot-php:1.7
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE}
        ports:
            - 127.0.0.1:8081:8080
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php81/php.ini
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./app:/app
            - ./logs/:/logs/
            - ./scripts/start_php.sh:/start_php.sh
            - ./scripts/check_file.sh:/check_file.sh
            - ./version:/version
            - ./mirror:/mirror
            - ./.env:/mirror/.env
            - ./update:/update
            - ./.git:/.git
            - ./singbox_windows:/singbox
            - ./docker-compose.override.yml:/docker/compose
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - warp:/etc/warp
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: php
        container_name: php-${VER}
        # restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_php.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.7
        extra_hosts:
            - "host.docker.internal:host-gateway"
        logging: *default-logging
        healthcheck:
            test: ["CMD", "/bin/sh", "/check_file.sh"]
            interval: 5s
            timeout: 5s
            retries: 5
    service:
        image: mercurykd/vpnbot-php:1.7
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php81/php.ini
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./app:/app
            - ./logs/:/logs/
            - ./version:/version
            - ./update:/update
            - ./.git:/.git
            - ./scripts/start_service.sh:/start_service.sh
            - ./docker-compose.override.yml:/docker/compose
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: service
        container_name: service-${VER}
        # restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_service.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.15
        logging: *default-logging
        depends_on:
            - up
            - ng
            - php
            - wg
            - wg1
            - ad
            - xr
            - oc
            - np
            - proxy
            - ss
            - dnstt
            - hy
            - tt
            - ovpn
    wg:
        image: mercurykd/vpnbot-wg:1.5
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/wg0.conf:/etc/wireguard/wg0.conf
            - ./config/pac.json:/pac.json
            - ./scripts/start_wg.sh:/start_wg.sh
            - ./scripts/reset_wg.sh:/reset_wg.sh
            - ./scripts/block_torrent.sh:/block_torrent.sh
            - ./scripts/block_exchange.sh:/block_exchange.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
        hostname: wireguard
        container_name: wireguard-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            ADDRESS: ${WGADDRESS}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_wg.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.4
        logging: *default-logging
    wg1:
        image: mercurykd/vpnbot-wg:1.5
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/wg1.conf:/etc/wireguard/wg0.conf
            - ./config/pac.json:/pac.json
            - ./scripts/start_wg.sh:/start_wg.sh
            - ./scripts/reset_wg.sh:/reset_wg.sh
            - ./scripts/block_torrent.sh:/block_torrent.sh
            - ./scripts/block_exchange.sh:/block_exchange.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
        hostname: wireguard1
        container_name: wireguard1-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            ADDRESS: ${WG1ADDRESS}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_wg.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.14
        logging: *default-logging
    ad:
        image: mercurykd/vpnbot-ad:1.4
        build:
            dockerfile: dockerfile/adguard.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - type: volume
              target: /opt/adguardhome/work
              source: adguard
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/:/config/
            - ./certs/:/certs/
            - ./logs/:/logs/
            - ./scripts/start_ad.sh:/start_ad.sh
        hostname: adguard
        container_name: adguard-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        networks:
            default:
                ipv4_address: 10.10.0.5
        cap_add:
            - NET_ADMIN
        entrypoint: ["/bin/sh", "/start_ad.sh"]
        logging: *default-logging
    telemt:
        image: mercurykd/vpnbot-telemt:1.0
        build:
            dockerfile: dockerfile/telemt.dockerfile
            args:
                image: ${IMAGE}
                TELEMT_VERSION: ${TELEMT_VERSION:-3.4.18}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/telemt:/telemt
            - ./scripts/start_telemt.sh:/start_telemt.sh
            - ./logs:/logs
        hostname: telemt
        container_name: telemt-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_telemt.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.20
        logging: *default-logging
    xr:
        image: mercurykd/vpnbot-xr:1.7
        build:
            dockerfile: dockerfile/xray.dockerfile
            args:
                image: ${IMAGE}
                XRAY_VERSION: ${XRAY_VERSION:-}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/xray.json:/xray.json
            - ./scripts/start_xray.sh:/start_xray.sh
            - ./logs:/logs
        hostname: xray
        container_name: xray-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_xray.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.9
            xray:
                ipv4_address: 10.10.1.9
        logging: *default-logging
    oc:
        image: mercurykd/vpnbot-oc:1.2
        build:
            dockerfile: dockerfile/ocserv.dockerfile
            args:
                image: ${IMAGE}
                OCSERV_VERSION: ${OCSERV_VERSION:-1.5.0}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config:/etc/ocserv
            - ./certs:/certs
            - ./scripts/start_oc.sh:/start_oc.sh
        hostname: ocserv
        container_name: openconnect-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_oc.sh"]
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        networks:
            default:
                ipv4_address: 10.10.0.11
        logging: *default-logging
    np:
        image: mercurykd/vpnbot-np:1.3
        build:
            dockerfile: dockerfile/naive.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config:/config
            - ./certs:/certs
            - ./scripts/start_np.sh:/start_np.sh
        hostname: naive
        container_name: naive-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_np.sh"]
        cap_add:
            - NET_ADMIN
        networks:
            default:
                ipv4_address: 10.10.0.12
        logging: *default-logging
    wp:
        image: mercurykd/vpnbot-wg:1.5
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE}
        cap_add:
            - NET_ADMIN
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config:/config
            - ./scripts/start_wp.sh:/start_wp.sh
            - warp:/etc/warp
        hostname: warp
        container_name: warp-${VER}
        command: ["/bin/sh", "/start_wp.sh"]
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        working_dir: /etc/warp
        networks:
            default:
                ipv4_address: 10.10.0.13
        logging: *default-logging
    proxy:
        image: mercurykd/vpnbot-ss:1.4
        build:
            dockerfile: dockerfile/shadowsocks.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/sslocal.json:/config.json
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./scripts/start_proxy.sh:/start_proxy.sh
        hostname: proxy
        container_name: proxy-${VER}
        depends_on:
            php:
                condition: service_healthy
        networks:
            default:
                ipv4_address: 10.10.0.3
        environment:
            TZ: ${TZ}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_proxy.sh"]
        logging: *default-logging
    ss:
        image: mercurykd/vpnbot-ss:1.4
        build:
            dockerfile: dockerfile/shadowsocks.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/ssserver.json:/config.json
            - ./config:/config
            - ./certs:/certs:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./scripts/start_ss.sh:/start_ss.sh
            - ./logs/:/logs/
        hostname: shadowsocks
        container_name: shadowsocks-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            CKPORT: ${CKPORT:-7443}
            STLSPORT: ${STLSPORT:-3443}
        ports:
            - ${CKPORT:-7443}:${CKPORT:-7443}/tcp
            - ${STLSPORT:-3443}:${STLSPORT:-3443}/tcp
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ss.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.6
        logging: *default-logging
    dnstt:
        image: mercurykd/vpnbot-dnstt:1.0
        build:
            dockerfile: dockerfile/dnstt.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./logs:/logs
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/dnstt:/dnstt
            - ./scripts/start_dnstt.sh:/start_dnstt.sh
        hostname: dnstt
        container_name: dnstt-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_dnstt.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.16
        logging: *default-logging
    ovpn:
        image: mercurykd/vpnbot-ovpn:1.2
        build:
            dockerfile: dockerfile/openvpn.dockerfile
            # Отдельная Alpine-база (новее глобального ${IMAGE}) — чтобы получить
            # openssl 3.5 LTS и свежий openvpn 2.6.x без обновления остальных
            # сервисов, которые пока завязаны на alpine 3.18.
            args:
                image: alpine:3.22
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/openvpn:/etc/openvpn
            - ./scripts/start_ovpn.sh:/start_ovpn.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs:/logs
        hostname: openvpn
        container_name: openvpn-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            OVPNPORT: ${OVPNPORT:-1194}
            OVPNPROTO: ${OVPNPROTO:-udp4}
            OVPNSUBNET: ${OVPNSUBNET:-10.8.0.0/24}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ovpn.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.19
        logging: *default-logging
    ipsec:
        image: mercurykd/vpnbot-ipsec:1.0
        build:
            dockerfile: dockerfile/ipsec.dockerfile
            # Отдельная Alpine-база (новее глобального ${IMAGE}) — свежие
            # strongswan/openssl, как у сервиса ovpn.
            args:
                image: alpine:3.22
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/ipsec:/config/ipsec
            - ./scripts/start_ipsec.sh:/start_ipsec.sh
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs:/logs
        hostname: ipsec
        container_name: ipsec-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            L2TPSUBNET: ${L2TPSUBNET:-10.9.1.0/24}
            IKEV2SUBNET: ${IKEV2SUBNET:-10.9.2.0/24}
        cap_add:
            - NET_ADMIN
        # charon ставит XFRM-политики в netns контейнера; форвардинг пакетов
        # клиентов включаем через sysctl (docker разрешает net.ipv4.*).
        sysctls:
            net.ipv4.ip_forward: 1
        # /dev/ppp НЕ пробрасываем устройством: его может не быть на хосте до
        # modprobe ppp_generic, и compose тогда не поднимет контейнер вовсе.
        # start_ipsec.sh делает mknod сам (CAP_MKNOD есть по умолчанию).
        # Для L2TP на хосте должен быть загружен модуль l2tp_ppp (см. nft-конфиг).
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ipsec.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.21
        logging: *default-logging
    tt:
        image: mercurykd/vpnbot-tt:1.0
        build:
            dockerfile: dockerfile/trusttunnel.dockerfile
            args:
                TT_REF: ${TT_REF:-master}
        volumes:
            - ./config/.profile:/root/.bashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/trusttunnel:/trusttunnel_endpoint
            - ./certs:/certs:ro
            - ./logs:/logs
            - ./scripts/start_tt.sh:/start_tt.sh
        hostname: trusttunnel
        container_name: trusttunnel-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        entrypoint: ["/bin/sh", "/start_tt.sh"]
        ports:
            - ${TTPORT:-2443}:8443/tcp
            - ${TTPORT:-2443}:8443/udp
        networks:
            default:
                ipv4_address: 10.10.0.18
        logging: *default-logging
    hy:
        image: mercurykd/vpnbot-hysteria:1.0
        build:
            dockerfile: dockerfile/hysteria.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh:/ssh
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./certs:/certs
            - ./logs:/logs
            - ./config:/config
            - ./scripts/start_hysteria.sh:/start_hysteria.sh
        hostname: hysteria
        container_name: hysteria-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_hysteria.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.17
        logging: *default-logging
