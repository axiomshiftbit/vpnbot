            dockerfile: dockerfile/hysteria.dockerfile
            args:
                PROTOCOL_GO_VERSION: ${PROTOCOL_GO_VERSION:-1.27.4}
                # :-default обязателен: пустая подстановка перекрыла бы дефолт
                # ARG, и FROM с пустым тегом уронил бы сборку.
                HYSTERIA_VERSION: ${HYSTERIA_VERSION:-v2.14.0}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh/pub:/ssh:ro
            - ./ssh/hosts/hy:/hostkey:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./certs:/certs:ro
            - ./logs:/logs
            # :ro — hysteria только читает /config/hysteria.yaml (пишет его бот).
            - ./config:/config:ro
            - ./config/hysteria/runtime:/var/lib/hysteria
            - ./scripts/start_hysteria.sh:/start_hysteria.sh
        hostname: hysteria
        container_name: hysteria-${VER}
        # Перезапуск демона Docker (обновление пакета) без перезагрузки иначе оставлял службу выключенной.
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 10s
        command: ["/bin/sh", "/start_hysteria.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.17
        mem_limit: 512m
        pids_limit: 512
        init: true
        logging: *default-logging

