x-logging:
      &default-logging
      driver: "json-file"
      options:
          max-size: "200k"
          max-file: "10"


networks:
    default:
        driver_opts:
            com.docker.network.bridge.name: br-vpnbot0
        ipam:
            config:
                - subnet: 10.10.0.0/24
    xray:
        driver_opts:
            com.docker.network.bridge.name: br-vpnbot1
        ipam:
            config:
                - subnet: 10.10.1.0/24
volumes:
    adguard:
    warp:

services:
    # init собирает осиротевшие процессы после рестартов через SSH.
    # Без него tail/shell в PID 1 накапливает зомби до pids_limit.
    up:
        image: ghcr.io/axiomshiftbit/vpnbot-ng:${VPNBOT_TAG:-latest}
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE:-alpine:3.24}
                NGINX_VERSION: ${NGINX_VERSION:-1.30.8}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/upstream.conf:/etc/nginx/nginx.conf
            - ./config/deny:/etc/nginx/deny
            - ./scripts/start_upstream.sh:/start_upstream.sh
            # Только ПУБЛИЧНЫЙ ключ — как у wg/wg1 ниже. Полный /ssh отдаёт
            # приватный ключ, а он даёт root-SSH во все контейнеры сборки:
            # дыра в любом сетевом демоне становилась компрометацией всего.
            # Приватный ключ нужен только php и service (bot.php: ssh()).
            - ./ssh/pub:/ssh:ro
            - ./ssh/hosts/up:/hostkey:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs/:/logs/
        ports:
            - 443:443/tcp
            - 443:443/udp
        hostname: upstream
        container_name: upstream-${VER}
        depends_on:
            ng:
                condition: service_healthy
            xr:
                condition: service_started
            oc:
                condition: service_started
                required: false
            np:
                condition: service_started
            tt:
                condition: service_started
                required: false
            ovpn:
                condition: service_started
                required: false
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_upstream.sh"]
        restart: unless-stopped
        networks:
            default:
                ipv4_address: 10.10.0.10
        # Потолки, а не резервирование: без них один разросшийся контейнер
        # (xray под нагрузкой, AdGuard с большим querylog, зафоркавшийся демон)
        # съедал память всего хоста, и OOM-killer выбирал жертву сам — обычно
        # не виновника. На 1-2 ГБ VPS это укладывало всю сборку. Значения
        # заведомо щедрые: срабатывают только на аномальном росте.
        mem_limit: 512m
        pids_limit: 512
        init: true
        logging: *default-logging
    ng:
        image: ghcr.io/axiomshiftbit/vpnbot-ng:${VPNBOT_TAG:-latest}
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE:-alpine:3.24}
                NGINX_VERSION: ${NGINX_VERSION:-1.30.8}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/nginx.conf:/etc/nginx/nginx.conf
            - ./config/override.conf:/etc/nginx/override.conf
            - ./config/location.conf:/etc/nginx/location.conf
            - ./config/nginx_default.conf:/nginx_default.conf
            - ./scripts/start_ng.sh:/start_ng.sh
            # :ro — в /certs пишет только certbot из php-контейнера.
            - ./certs/:/certs/:ro
            - ./ssh/pub:/ssh:ro
            - ./ssh/hosts/ng:/hostkey:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./logs/:/logs/
            # Страницы обновляет php; nginx достаточно доступа на чтение.
            - ./app/webapp:/app:ro
        ports:
            - 80:80
        hostname: nginx
        container_name: nginx-${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ng.sh"]
        restart: unless-stopped
        networks:
            default:
                ipv4_address: 10.10.0.2
            xray:
                ipv4_address: 10.10.1.2
        mem_limit: 512m
        pids_limit: 512
        init: true
        logging: *default-logging
        depends_on:
            php:
                condition: service_healthy
            ad:
                condition: service_started
            ss:
                condition: service_started
                required: false
            xr:
                condition: service_started
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 10s
            timeout: 5s
            retries: 3
    php:
        image: ghcr.io/axiomshiftbit/vpnbot-php:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                PROTOCOL_GO_VERSION: ${PROTOCOL_GO_VERSION:-1.27.4}
                image: ${IMAGE:-alpine:3.24}
                DNSLOOKUP_VERSION: ${DNSLOOKUP_VERSION:-v1.12.0}
                SINGBOX_VERSION: ${SINGBOX_VERSION:-v1.14.4}
                MIHOMO_VERSION: ${MIHOMO_VERSION:-v1.19.34}
                SINGBOX_SOURCE_SHA256: ${SINGBOX_SOURCE_SHA256:-0958ccd23b1ea9a141d715d15478b1e040fd04bcca19d8ff5529636b1b753e18}
                MIHOMO_SOURCE_SHA256: ${MIHOMO_SOURCE_SHA256:-e3284a44f1052f1c454c90d418faa244516c2470bf232b455ea18fc4f5fa6028}
        ports:
            # 127.0.0.1:8081:8080 убран: 8080 в этом контейнере — control API
            # unit, у которого нет аутентификации. Он переведён на unix-сокет
            # (start_php.sh), в репозитории на 8081 никто не ходил.
            # Веб-панель управления (app/panel): отдельный слушатель unit,
            # доступный только на loopback хоста. Снаружи её нет — ходить
            # через `ssh -L 8090:127.0.0.1:8090 <сервер>`.
            - 127.0.0.1:8090:8090
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php85/php.ini
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./app:/app
            - ./logs/:/logs/
            - ./scripts/start_php.sh:/start_php.sh
            - ./scripts/check_file.sh:/check_file.sh
            - ./version:/version
            - ./mirror:/mirror
            - ./.env:/mirror/.env
            - ./update:/update
            - ./.git:/.git
            - ./singbox_windows:/singbox
            - ./docker-compose.override.yml:/docker/compose
            # docker.sock убран: Docker API теперь только через сервис
            # dockerproxy (см. его комментарий и config/dockerproxy.conf).
            - warp:/etc/warp
            # Служба хоста acme-window (scripts/acme_window.py): бот кладёт
            # запросы в request, служба пишет состояние в state — у бота только
            # чтение, чтобы файлы, которые читает root хоста, писал только он.
            - ./acme/request:/acme/request
            - ./acme/state:/acme/state:ro
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: php
        container_name: php-${VER}
        # Бот и периодика обязаны подниматься сами: упавший php означал молчание
        # бота до ручного `make r`, а единственной страховкой был @reboot в cron.
        # `docker compose down` политику не обходит — остановка руками
        # по-прежнему останавливает.
        restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_php.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.7
        extra_hosts:
            - "host.docker.internal:host-gateway"
        mem_limit: 1g
        pids_limit: 512
        init: true
        logging: *default-logging
        healthcheck:
            test: ["CMD", "/bin/sh", "/check_file.sh"]
            interval: 5s
            timeout: 5s
            retries: 5
    service:
        image: ghcr.io/axiomshiftbit/vpnbot-php:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                PROTOCOL_GO_VERSION: ${PROTOCOL_GO_VERSION:-1.27.4}
                image: ${IMAGE:-alpine:3.24}
                DNSLOOKUP_VERSION: ${DNSLOOKUP_VERSION:-v1.12.0}
                SINGBOX_VERSION: ${SINGBOX_VERSION:-v1.14.4}
                MIHOMO_VERSION: ${MIHOMO_VERSION:-v1.19.34}
                SINGBOX_SOURCE_SHA256: ${SINGBOX_SOURCE_SHA256:-0958ccd23b1ea9a141d715d15478b1e040fd04bcca19d8ff5529636b1b753e18}
                MIHOMO_SOURCE_SHA256: ${MIHOMO_SOURCE_SHA256:-e3284a44f1052f1c454c90d418faa244516c2470bf232b455ea18fc4f5fa6028}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php85/php.ini
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./ssh/hosts/service:/hostkey:ro
            - ./app:/app
            - ./logs/:/logs/
            - ./version:/version
            - ./update:/update
            - ./.git:/.git
            - ./scripts/start_service.sh:/start_service.sh
            - ./docker-compose.override.yml:/docker/compose
            - warp:/etc/warp
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: service
        container_name: service-${VER}
        # Бот и периодика обязаны подниматься сами: упавший php означал молчание
        # бота до ручного `make r`, а единственной страховкой был @reboot в cron.
        # `docker compose down` политику не обходит — остановка руками
        # по-прежнему останавливает.
        restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_service.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.15
        mem_limit: 1g
        pids_limit: 512
        init: true
        logging: *default-logging
        depends_on:
            up:
                condition: service_started
            ng:
                condition: service_started
            php:
                condition: service_started
            wg:
                condition: service_started
            wg1:
                condition: service_started
            ad:
                condition: service_started
            xr:
                condition: service_started
            oc:
                condition: service_started
                required: false
            np:
                condition: service_started
            proxy:
                condition: service_started
            ss:
                condition: service_started
                required: false
            dnstt:
                condition: service_started
                required: false
            hy:
                condition: service_started
                required: false
            tt:
                condition: service_started
                required: false
            ovpn:
                condition: service_started
                required: false
            ipsec:
                condition: service_started
                required: false
            telemt:
                condition: service_started
                required: false
            wp:
                condition: service_started
    # Брокер Docker API. Сокет держит ОН, а php и service ходят к нему по HTTP
    # с allowlist'ом по методу и пути (config/dockerproxy.conf) — раньше сокет
    # был примонтирован прямо в php и service, и суффикс ":ro" не ограничивал
    # ни одной операции API: оттуда делался POST /containers/create, то есть
    # root на хосте. Отдельной сборки нет намеренно: нужен только nginx, а
    # образ ng уже собирается, и матрица сервисов в CI перечислена руками.
    dockerproxy:
        image: ghcr.io/axiomshiftbit/vpnbot-ng:${VPNBOT_TAG:-latest}
        volumes:
            - ./config/dockerproxy.conf:/etc/nginx/dockerproxy.conf:ro
            - ./logs/:/logs/
            # Без ":ro" сознательно: на операции Docker API он всё равно не
            # влияет, а надпись создавала ложное ощущение ограничения.
            # Ограничивает здесь nginx выше по стеку.
            - /var/run/docker.sock:/var/run/docker.sock
        hostname: dockerproxy
        container_name: dockerproxy-${VER}
        # Перезапуск демона Docker (обновление пакета) без перезагрузки иначе оставлял службу выключенной.
        restart: unless-stopped
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["nginx", "-c", "/etc/nginx/dockerproxy.conf", "-g", "daemon off;"]
        networks:
            default:
                ipv4_address: 10.10.0.8
        mem_limit: 512m
        pids_limit: 512
        init: true
        logging: *default-logging
    wg:
        image: ghcr.io/axiomshiftbit/vpnbot-wg:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                PROTOCOL_GO_VERSION: ${PROTOCOL_GO_VERSION:-1.27.4}
                image: ${IMAGE:-alpine:3.24}
                AWG_GO_VERSION: ${AWG_GO_VERSION:-v3.1.20261116}
                AWG_TOOLS_VERSION: ${AWG_TOOLS_VERSION:-v3.1.20260812}
                WGCF_VERSION: ${WGCF_VERSION:-v2.3.1}
                XRAY_VERSION: ${XRAY_VERSION:-v26.11.9}
        volumes:
            - ./logs:/logs
            - ./config/.profile:/root/.ashrc:ro
            - ./config/wg0.conf:/etc/wireguard/wg0.conf
            # :ro — каталог смонтирован ради чтения /config/pac.json (start_wg.sh,
            # reset_wg.sh). Без него контейнер, терминирующий недоверенный
            # клиентский трафик, имел запись в xray.json, clients.json,
            # ocserv.passwd и credentials.toml. wg0.conf монтируется отдельно.
            - ./config:/config:ro
            - ./scripts/start_wg.sh:/start_wg.sh
            - ./scripts/reset_wg.sh:/reset_wg.sh
            - ./scripts/block_torrent.sh:/block_torrent.sh
            - ./scripts/block_exchange.sh:/block_exchange.sh
            # Только ПУБЛИЧНЫЙ ключ (./ssh/pub кладёт start_php.sh). Полный /ssh
            # содержит и приватный ключ, которым бот заходит root'ом во ВСЕ
            # контейнеры, — а этот контейнер терминирует недоверенный клиентский
            # трафик. start_wg.sh нужен только key.pub для authorized_keys.
            - ./ssh/pub:/ssh:ro
            - ./ssh/hosts/wg:/hostkey:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
        hostname: wireguard
        container_name: wireguard-${VER}
        # Перезапуск демона Docker (обновление пакета) без перезагрузки иначе оставлял службу выключенной.
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            ADDRESS: ${WGADDRESS}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_wg.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.4
        mem_limit: 512m
        pids_limit: 512
        init: true
        logging: *default-logging
    wg1:
        image: ghcr.io/axiomshiftbit/vpnbot-wg:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                PROTOCOL_GO_VERSION: ${PROTOCOL_GO_VERSION:-1.27.4}
                image: ${IMAGE:-alpine:3.24}
                AWG_GO_VERSION: ${AWG_GO_VERSION:-v3.1.20261116}
                AWG_TOOLS_VERSION: ${AWG_TOOLS_VERSION:-v3.1.20260812}
                WGCF_VERSION: ${WGCF_VERSION:-v2.3.1}
                XRAY_VERSION: ${XRAY_VERSION:-v26.11.9}
        volumes:
            - ./logs:/logs
            - ./config/.profile:/root/.ashrc:ro
            - ./config/wg1.conf:/etc/wireguard/wg0.conf
            # :ro — см. комментарий у wg0-сервиса.
            - ./config:/config:ro
            - ./scripts/start_wg.sh:/start_wg.sh
            - ./scripts/reset_wg.sh:/reset_wg.sh
            - ./scripts/block_torrent.sh:/block_torrent.sh
            - ./scripts/block_exchange.sh:/block_exchange.sh
            # Только публичный ключ — см. комментарий у сервиса wg.
            - ./ssh/pub:/ssh:ro
            - ./ssh/hosts/wg1:/hostkey:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
        hostname: wireguard1
        container_name: wireguard1-${VER}
        # Перезапуск демона Docker (обновление пакета) без перезагрузки иначе оставлял службу выключенной.
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            ADDRESS: ${WG1ADDRESS}
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_wg.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.14
        mem_limit: 512m
        pids_limit: 512
        init: true
        logging: *default-logging
    ad:
        image: ghcr.io/axiomshiftbit/vpnbot-ad:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/adguard.dockerfile
            args:
                PROTOCOL_GO_VERSION: ${PROTOCOL_GO_VERSION:-1.27.4}
                # Форма :-default обязательна: голое ${ADGUARD_VERSION} при
                # отсутствии переменной передаёт пустую строку, она перекрывает
                # дефолт ARG, и FROM adguard/adguardhome: роняет сборку.
                ADGUARD_VERSION: ${ADGUARD_VERSION:-v1.0.0}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - type: volume
              target: /opt/adguardhome/work
              source: adguard
            - ./ssh/pub:/ssh:ro
            - ./ssh/hosts/ad:/hostkey:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
            # /config остаётся на ЗАПИСЬ умышленно: AdGuardHome сам
            # переписывает свой AdGuardHome.yaml (правки через веб-панель,
            # миграция схемы при обновлении версии), с :ro он падал бы на
            # старте. Отдельным файловым mount'ом это не лечится: AGH пишет
            # через tmp+rename, а файловый bind-mount прибит к иноду.
            - ./config/:/config/
            - ./certs/:/certs/:ro
            - ./logs/:/logs/
            - ./scripts/start_ad.sh:/start_ad.sh
            - ./scripts/service_supervisor.sh:/service_supervisor.sh:ro
            - ./scripts/service_daemon.sh:/service_daemon.sh:ro
        hostname: adguard
        container_name: adguard-${VER}
        # Перезапуск демона Docker (обновление пакета) без перезагрузки иначе оставлял службу выключенной.
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        # 10s, а не 1s: AdGuardHome дописывает querylog и stats в volume, а через секунду после
        # SIGTERM прилетает SIGKILL — и это на КАЖДОМ `make r`,
        # который делает --force-recreate.
        stop_grace_period: 10s
        networks:
            default:
                ipv4_address: 10.10.0.5
        cap_add:
            - NET_ADMIN
        entrypoint: ["/bin/sh", "/start_ad.sh"]
        healthcheck:
            test: ["CMD", "/bin/sh", "/service_supervisor.sh", "health"]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 45s
        mem_limit: 1g
        pids_limit: 512
        init: true
        logging: *default-logging
    telemt:
        profiles: [telemt]
        image: ghcr.io/axiomshiftbit/vpnbot-telemt:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/telemt.dockerfile
            args:
                image: ${IMAGE:-alpine:3.24}
                TELEMT_VERSION: ${TELEMT_VERSION:-3.5.17}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./ssh/pub:/ssh:ro
            - ./ssh/hosts/telemt:/hostkey:ro
            - ./config/sshd_config:/etc/ssh/sshd_config
            - ./config/telemt:/telemt
            - ./scripts/start_telemt.sh:/start_telemt.sh
            - ./scripts/telemt_state.py:/telemt_state.py:ro
            - ./logs:/logs
        hostname: telemt
        container_name: telemt-${VER}
        # Перезапуск демона Docker (обновление пакета) без перезагрузки иначе оставлял службу выключенной.
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 45s
        command: ["/bin/sh", "/start_telemt.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.20
        # 768m, а не 512m: в WEB-режиме бот пинит telemt собственный
        # web.limits.memory_envelope_bytes = 256 MiB (дефолт telemt 3.5.5 — 1.25
        # GiB, на 2 ГБ VPS это потолок больше самой машины). Лимит cgroup держим
        # выше этого потолка, чтобы при всплеске срабатывал backpressure telemt,
        # а не OOM-killer, который убил бы контейнер вместе с обычным MTProto.
        # Это потолок, а не резервирование: незанятая память остаётся системе.
        mem_limit: 768m
        pids_limit: 512
        init: true
        logging: *default-logging
    xr:
        image: ghcr.io/axiomshiftbit/vpnbot-xr:${VPNBOT_TAG:-latest}
        build:
            dockerfile: dockerfile/xray.dockerfile
            args:
                PROTOCOL_GO_VERSION: ${PROTOCOL_GO_VERSION:-1.27.4}
                image: ${IMAGE:-alpine:3.24}
                XRAY_VERSION: ${XRAY_VERSION:-}
                XRAY_VERSION_2: ${XRAY_VERSION_2:-}
