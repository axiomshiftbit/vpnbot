        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        environment:
            # IP обязателен: start_ipsec.sh гейтит на нём выпуск server.crt
            # (SAN=IP) и генерацию swanctl.conf. Из env_file (.env) приходит
            # пустая строка IP= — реальное значение передаёт makefile при
            # `docker compose up` (IP=$(IP) …), поэтому берём его отсюда.
            IP: ${IP}
            L2TPSUBNET: ${L2TPSUBNET:-10.9.1.0/24}
            IKEV2SUBNET: ${IKEV2SUBNET:-10.9.2.0/24}
            IPSEC_IKEV2_ENABLED: ${IPSEC_IKEV2_ENABLED:-1}
            IPSEC_L2TP_ENABLED: ${IPSEC_L2TP_ENABLED:-1}
        cap_add:
            - NET_ADMIN
        # charon ставит XFRM-политики в netns контейнера; форвардинг пакетов
        # клиентов включаем через sysctl (docker разрешает net.ipv4.*).
        sysctls:
            net.ipv4.ip_forward: 1
        # /dev/ppp НЕ пробрасываем устройством: его может не быть на хосте до
        # modprobe ppp_generic, и compose тогда не поднимет контейнер вовсе.
        # start_ipsec.sh делает mknod сам; cgroup должен разрешать и открытие
        # устройства, иначе pppd получает EPERM даже при наличии CAP_MKNOD.
        device_cgroup_rules:
            - 'c 108:0 rwm'
        # Для L2TP на хосте должен быть загружен модуль l2tp_ppp (см. nft-конфиг).
        # 10s, а не 1s: strongswan сбрасывает состояние SA, а через секунду после
        # SIGTERM прилетает SIGKILL — и это на КАЖДОМ `make r`,
        # который делает --force-recreate.
        stop_grace_period: 10s
        command: ["/bin/sh", "/start_ipsec.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.21
        mem_limit: 512m
        pids_limit: 512
        init: true
        logging: *default-logging
