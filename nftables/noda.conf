#!/usr/sbin/nft -f
# VPNBot: профиль nftables минимальной управляемой ноды.
# Установщик ноды спрашивает внешний интерфейс (WAN), публичные адреса,
# адреса основного бота и администратора, порты SSH и подставляет их сюда.
# MyServer/ASN — дополнительные списки; доверенные адреса не угадываются.
# VPNBOT_MANAGED_NODE_HOST
# Xray и необязательная заглушка NGINX работают без Docker-моста.
# SSH ноды: MyServer + ASN. VPN: только MyServer. Остальное закрыто.
# SERVER_SSH_PORTS — SSH управления сервером, только MyServer (IPv4).
# Не применять к полной установке VPNBot: сначала подготовить её перенос.
# Установщик ноды заполняет node4/node6_sources, admins, ssh и SERVER_SSH_PORTS
# из проверенных параметров подключения. MyServer/ASN остаются дополнительными
# списками, а guard ноды всегда проверяет разрешения независимо от них.
# Установщик VPNBot создаёт /etc/vpnbot-node/guard.nft; в нём находятся
# DNAT, ограничение UID и временный набор acme_http. До установки ноды
# внешние порты VPN и ACME закрыты. Перезагрузка сохраняет это поведение.
# Сначала nft -c, затем атомарная загрузка с резервом и таймером отката.
# правила только ручные. Docker ноды — /etc/docker/daemon.json:
# "iptables": false, "ip6tables": false, "ip-forward": false (установщик проверяет).
# Внешний интерфейс; установщик ноды/nft_host_setup меняет только это значение.
define WAN = "eth0"
define NODE_SSH_PORTS = { 22 }
# Действующие порты sshd: установщик ноды
# сверяют их с sshd -T; ASN/NODE_SSH_PORTS не расширяются.
define SERVER_SSH_PORTS = { 22 }
flush ruleset

define PUBLIC_IP = 203.0.113.20

table ip filter {
    set node4_sources { type ipv4_addr; elements = { 198.51.100.10 }; }
    set node4_admins { type ipv4_addr; elements = { 203.0.113.30 }; }
    set node4_ssh { type ipv4_addr; flags interval; }

    include "/opt/maxmind/list/asn_nft/geoip-def-asn.nft"
    include "/opt/maxmind/list/asn_nft/geoip-ipv4.nft"
    include "/opt/maxmind/list/my_server/geoip-def-my_server.nft"
    include "/opt/maxmind/list/my_server/geoip-ipv4.nft"

    # кадры с WAN, адресованные не этому хосту (см. ingress_sanity).
    chain drop_preroute_l2 {
        limit rate 10/minute burst 5 packets log prefix "PREROUTE-L2: "
        counter drop
    }
    chain early {
        type filter hook prerouting priority -450; policy accept;
        iifname != "lo" ip hdrlength != 5 counter drop
        iifname != "lo" ip saddr 127.0.0.0/8 counter drop
        iifname != "lo" ip daddr 127.0.0.0/8 counter drop
        # сеть хостера. С WAN принимаются только unicast-кадры
        # на MAC хоста и только на его собственный адрес: сосед по сегменту
        # не использует сервер как маршрутизатор (транзит, адреса Docker/VPN),
        # L2 broadcast/multicast и чужие кадры отбрасываются до conntrack.
        # DHCP-клиент и ARP идут мимо этой цепочки (packet socket, семейство arp).
        iifname $WAN meta pkttype { broadcast, multicast, other } jump drop_preroute_l2
        iifname $WAN fib daddr type != local jump drop_preroute_l2
        # подмена источника. Нулевая сеть, свой/широковещательный/
        # multicast адрес и строгий обратный маршрут (ответ ушёл бы через
        # другой интерфейс, например docker0) отбрасываются до conntrack.
        iifname $WAN ip saddr 0.0.0.0/8 jump drop_preroute_l2
        iifname $WAN fib saddr type { local, broadcast, multicast } jump drop_preroute_l2
        iifname $WAN fib saddr . iif oif missing jump drop_preroute_l2
        iifname != "lo" icmp type redirect counter drop
    }
    chain ssh {
        meter node_host_syn size 65535 { ip saddr timeout 1m limit rate 15/second burst 30 packets } jump ssh_log
        counter drop
    }
    chain ssh_log {
        limit rate 5/second log prefix "INPUT-SSH: " level info
        counter accept
    }
    chain input {
        type filter hook input priority 0; policy drop;
        iifname "lo" accept
        ct state invalid counter drop
        ct state established,related accept
        iifname $WAN icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        meta mark set 0
        meta mark set ip saddr map @asn
        meta mark set ip saddr map @my_server

        # VPNBOT_INSTALLER_ACL4
        # явные адреса бота/администратора идут без лимита по источнику:
        # поддельные SYN от их адреса не выбивают управление. Лимит — для сетей и списков.
        iifname $WAN ip saddr @node4_admins tcp dport $SERVER_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh_log
        iifname $WAN ip saddr @node4_ssh tcp dport $NODE_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh
        iifname $WAN ip saddr @node4_sources ct status dnat ct original proto-dst 443 tcp dport 8443 counter accept
        iifname $WAN ip saddr @node4_sources ct status dnat ct original proto-dst { 51820, 51821 } udp dport { 51830, 51831 } counter accept
        iifname $WAN meta mark { $ASN, $MY_SERVER } tcp dport $NODE_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh
        # SSH управления сервером: только MyServer, отдельно от SSH ноды.
        iifname $WAN meta mark $MY_SERVER tcp dport $SERVER_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh
        # Только пакеты, перенаправленные компонентом минимальной ноды.
        iifname $WAN meta mark $MY_SERVER ct status dnat ct original proto-dst 443 tcp dport 8443 counter accept
        # Эти UDP-порты остаются закрыты без соответствующего DNAT ноды.
        iifname $WAN meta mark $MY_SERVER ct status dnat ct original proto-dst { 51820, 51821 } udp dport { 51830, 51831 } counter accept
        # Ранний guard пропускает это только при действующем таймере ACME.
        iifname $WAN ct status dnat ct original proto-dst 80 tcp dport 8080 counter accept
        # VPN и включённые резервные WG/AWG перенаправляет только guard ноды;
        # он проверяет источники основного бота и список VPN без SSH.
        iifname $WAN ct status dnat ct original proto-dst 443 tcp dport 8443 counter accept
        iifname $WAN ct status dnat ct original proto-dst { 51820, 51821 } udp dport { 51830, 51831 } counter accept
        limit rate 5/second burst 10 packets log prefix "INPUT-DROP: " level warn
        counter drop
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
        limit rate 5/second burst 10 packets log prefix "FORWARD-DROP: " level warn
        counter drop
    }
    chain output {
        type filter hook output priority 0; policy accept;
        ct state invalid counter drop
    }
}

# ARP на внешнем интерфейсе. Внутренние адреса Docker/VPN и
# loopback не запрашиваются и не объявляются через WAN: иначе сосед по
# сегменту хостера получает MAC сервера для 10.10.x.x/172.17.x.x и шлёт
# туда пакеты напрямую (arp_ignore=0 по умолчанию отвечает на любой свой IP).
# Публичный адрес и шлюз хостера (в том числе частный 10.0.0.1) не затронуты.
# Шлюз внутри этих диапазонов несовместим с профилем и без этой таблицы.
table arp wan_arp_guard {
    # Журнал: PREROUTE-ARP -> security.log; отказ выполняется независимо от лимита журнала.
    chain drop_arp_wan {
        limit rate 10/minute burst 5 packets log prefix "PREROUTE-ARP: "
        counter drop
    }
    chain input {
        type filter hook input priority 0; policy accept;
        iifname $WAN arp daddr ip { 127.0.0.0/8, 10.0.1.0/24, 10.0.2.0/23, 10.8.0.0/22, 10.9.0.0/16, 10.10.0.0/16, 172.17.0.0/16, 172.18.0.0/15 } jump drop_arp_wan
        iifname $WAN arp saddr ip { 127.0.0.0/8, 10.0.1.0/24, 10.0.2.0/23, 10.8.0.0/22, 10.9.0.0/16, 10.10.0.0/16, 172.17.0.0/16, 172.18.0.0/15 } jump drop_arp_wan
    }
    chain output {
        type filter hook output priority 0; policy accept;
        oifname $WAN arp saddr ip { 127.0.0.0/8, 10.0.1.0/24, 10.0.2.0/23, 10.8.0.0/22, 10.9.0.0/16, 10.10.0.0/16, 172.17.0.0/16, 172.18.0.0/15 } counter drop
    }
}
table ip6 filter {
    # то же для IPv6 до conntrack. С WAN принимаются только адреса
    # этого хоста и multicast NDP (ff02::1, solicited-node ff02::1:ffXX:XXXX).
    # Чужие адреса /64 хостера, прочий multicast (mDNS, all-routers, MLD-отчёты),
    # свой адрес в качестве источника и Routing Header 0 отбрасываются.
    chain drop6_preroute_l2 {
        limit rate 10/minute burst 5 packets log prefix "PREROUTE-L2V6: "
        counter drop
    }
    chain ingress6_sanity {
        type filter hook prerouting priority -450; policy accept;
        iifname $WAN meta pkttype other jump drop6_preroute_l2
        iifname $WAN fib saddr type local jump drop6_preroute_l2
        iifname $WAN fib daddr type != { local, multicast } jump drop6_preroute_l2
        iifname $WAN ip6 daddr ff00::/8 ip6 daddr != { ff02::1, ff02::1:ff00:0/104 } jump drop6_preroute_l2
        iifname $WAN rt type 0 jump drop6_preroute_l2
    }
    set node6_admins { type ipv6_addr;
    }
    set node6_ssh { type ipv6_addr; flags interval; }

    # Списки заполняет установщик ноды. Пустой список
    # сохраняет вход по IPv6 закрытым. Источники VPN также проверяет guard.
    set node6_sources {
        type ipv6_addr;
    }
    set node6_public {
        type ipv6_addr;
    }
    set ipv6_routers {
        type ipv6_addr;
    }
    # Необязательные IPv6-подсети ASN, исключительно для SSH.
    set ssh_asn6 {
        type ipv6_addr; flags interval;
    }
    chain ssh {
        meter node_host_syn6 size 65535 { ip6 saddr timeout 1m limit rate 15/second burst 30 packets } jump ssh_log
        counter drop
    }
    chain ssh_log {
        limit rate 5/second log prefix "INPUT6-SSH: " level info
        counter accept
    }
    chain input {
        type filter hook input priority 0; policy drop;
        iifname "lo" accept
        iifname != "lo" ip6 saddr ::1 counter drop
        iifname != "lo" ip6 daddr ::1 counter drop
        ct state invalid counter drop
        icmpv6 type nd-redirect counter drop
        iifname $WAN ip6 hoplimit 255 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } icmpv6 code 0 accept
        # MLD-запросы маршрутизатора/коммутатора (только link-local, hop limit 1):
        # без ответа на них коммутатор с MLD snooping перестаёт доставлять NDP ноде.
        iifname $WAN ip6 saddr fe80::/10 ip6 hoplimit 1 icmpv6 type mld-listener-query icmpv6 code 0 accept
        iifname $WAN ip6 saddr { ::/128, ::1/128, fc00::/7, ff00::/8 } counter drop
        ct state established,related accept
        iifname $WAN ip6 saddr @ipv6_routers ip6 hoplimit 255 icmpv6 type nd-router-advert icmpv6 code 0 accept
        iifname $WAN icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept

        # VPNBOT_INSTALLER_ACL6
        iifname $WAN ip6 saddr @node6_admins tcp dport $SERVER_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh_log
        iifname $WAN ip6 saddr @node6_ssh tcp dport $NODE_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh
        iifname $WAN ip6 saddr @node6_sources ct status dnat ct original proto-dst 443 tcp dport 8443 counter accept
        iifname $WAN ip6 saddr @node6_sources ct status dnat ct original proto-dst { 51820, 51821 } udp dport { 51830, 51831 } counter accept
        iifname $WAN ip6 saddr @node6_sources ip6 daddr @node6_public tcp dport $NODE_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh_log
        iifname $WAN ip6 saddr @ssh_asn6 ip6 daddr @node6_public tcp dport $NODE_SSH_PORTS ct state new tcp flags & (fin|syn|rst|ack) == syn jump ssh
        iifname $WAN ip6 saddr @node6_sources ct original ip6 daddr @node6_public ct status dnat ct original proto-dst 443 tcp dport 8443 counter accept
        iifname $WAN ip6 saddr @node6_sources ct original ip6 daddr @node6_public ct status dnat ct original proto-dst { 51820, 51821 } udp dport { 51830, 51831 } counter accept
        iifname $WAN ct status dnat ct original proto-dst 80 tcp dport 8080 counter accept
        iifname $WAN ct status dnat ct original proto-dst 443 tcp dport 8443 counter accept
        iifname $WAN ct status dnat ct original proto-dst { 51820, 51821 } udp dport { 51830, 51831 } counter accept
        limit rate 5/second burst 10 packets log prefix "INPUT6-DROP: " level warn
        counter drop
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
        limit rate 5/second burst 10 packets log prefix "FORWARD6-DROP: " level warn
        counter drop
    }
    chain output {
        type filter hook output priority 0; policy accept;
        ct state invalid counter drop
    }
}
# Появляется после установки ноды. Не редактировать вручную: управляет VPNBot.
include "/etc/vpnbot-node/guard*.nft"
# Совместимость с необязательным SSH-туннелем Telegram, без публичного SOCKS.
include "/etc/vpnbot-telegram/guard*.nft"
